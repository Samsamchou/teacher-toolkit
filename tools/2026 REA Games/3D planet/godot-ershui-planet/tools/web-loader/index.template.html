<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>二水小行星 Ershui Planet</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* [1118] 載入畫面：已下載 MB／速度、卡住重試（RDQ-spec-planet-ipad-load-20261118 ③④） */
#load-info {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(10% + 28px);
	text-align: center;
	font: 600 18px/1.4 'Noto Sans', Arial, sans-serif;
	color: #fff;
	text-shadow: 0 1px 3px #000, 0 0 6px #000;
	display: none;
}
#load-info .warn { color: #ffd84d; }
#load-retry {
	display: none;
	margin: 8px auto 0;
	padding: 10px 26px;
	font: 700 20px 'Noto Sans', Arial, sans-serif;
	border: 0;
	border-radius: 12px;
	background: #ffd84d;
	color: #222;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<div id="load-info"><div id="load-text"></div><button id="load-retry" type="button">重試 Retry</button></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":72215636,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		Promise.resolve().then(() => startWithCache()); // 等下面的變數都宣告好再開始
	}

	// ---- [1118] iPad 載入：存在 iPad 上＋顯示 MB／速度＋卡住自動重試 ----
	const loadInfo = document.getElementById('load-info');
	const loadText = document.getElementById('load-text');
	const loadRetry = document.getElementById('load-retry');
	const STALL_MS = 20000;   // 20 秒沒進度＝卡住
	const AUTO_MAX = 3;       // 自動重試最多 3 次，之後只顯示按鈕
	const RETRY_KEY = 'ershuiPlanetRetry';
	let lastBytes = -1, lastChange = Date.now(), done = false, fromCache = false;
	const samples = [];

	function mb(n) { return (n / 1048576).toFixed(1); }
	function retries() { try { return parseInt(sessionStorage.getItem(RETRY_KEY) || '0', 10) || 0; } catch (e) { return 0; } }
	function setRetries(n) { try { sessionStorage.setItem(RETRY_KEY, String(n)); } catch (e) { /* 無痕模式 */ } }
	function reloadNow() { location.reload(); }
	loadRetry.addEventListener('click', () => { setRetries(0); reloadNow(); });

	async function ensureServiceWorker() {
		if (!('serviceWorker' in navigator)) return;
		try {
			const reg = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
			try { await reg.update(); } catch (e) { /* 離線時沿用舊的 */ }
			if (!navigator.serviceWorker.controller || reg.installing || reg.waiting) {
				// 第一次或剛改版：等新版接手，這次下載才會存進 iPad
				await Promise.race([
					new Promise((r) => navigator.serviceWorker.addEventListener('controllerchange', r, { once: true })),
					new Promise((r) => setTimeout(r, 5000)),
				]);
			}
			if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
		} catch (err) {
			console.warn('service worker:', err);
		}
	}

	function showInfo(html, stalled) {
		loadInfo.style.display = 'block';
		loadText.innerHTML = html;
		loadRetry.style.display = stalled ? 'inline-block' : 'none';
	}

	function onProgress(current, total) {
		if (current > 0 && total > 0) {
			statusProgress.value = current;
			statusProgress.max = total;
		} else {
			statusProgress.removeAttribute('value');
			statusProgress.removeAttribute('max');
		}
		const now = Date.now();
		if (current !== lastBytes) {
			lastBytes = current;
			lastChange = now;
		}
		samples.push([now, current]);
		while (samples.length > 1 && now - samples[0][0] > 3000) samples.shift();
		if (total > 0 && current >= total) {
			showInfo('下載完成，正在啟動遊戲…<br>Starting…', false);
			return;
		}
		let speed = 0;
		if (samples.length > 1) {
			const [t0, b0] = samples[0];
			speed = (current - b0) / Math.max(0.001, (now - t0) / 1000);
		}
		if (fromCache) {
			showInfo('從 iPad 讀取中…（不用重新下載）<br>Loading from this iPad…', false);
			return;
		}
		const tot = total > 0 ? ' ／ 共 ' + mb(total) + ' MB' : '';
		showInfo('已下載 ' + mb(current) + ' MB' + tot + '　速度 ' + mb(speed) + ' MB/s'
			+ (retries() ? '<br><span class="warn">（第 ' + retries() + ' 次重試）</span>' : ''), false);
	}

	function watchdog() {
		if (done || !initializing) return;
		const total = statusProgress.max || 0;
		const stuck = Date.now() - lastChange > STALL_MS && !(total > 0 && lastBytes >= total);
		if (stuck) {
			const n = retries();
			if (n < AUTO_MAX) {
				setRetries(n + 1);
				showInfo('<span class="warn">網路卡住，正在重試…（第 ' + (n + 1) + '／' + AUTO_MAX + ' 次）</span><br>Network stuck, retrying…', true);
				setTimeout(reloadNow, 1500);
				done = true;
				return;
			}
			showInfo('<span class="warn">網路卡住了，請按「重試」或檢查 Wi-Fi</span><br>Network stuck — tap Retry.', true);
		}
		setTimeout(watchdog, 2000);
	}

	async function startWithCache() {
		showInfo('準備下載…<br>Preparing…', false);
		await ensureServiceWorker();
		try {
			fromCache = !!(window.caches && await caches.match(new URL('index.pck', location.href).pathname));
		} catch (e) { fromCache = false; }
		lastChange = Date.now();
		setTimeout(watchdog, 2000);
		engine.startGame({ 'onProgress': onProgress }).then(() => {
			done = true;
			setRetries(0);
			setStatusMode('hidden');
		}, (err) => { done = true; displayFailureNotice(err); loadRetry.style.display = 'inline-block'; loadInfo.style.display = 'block'; });
	}
}());
		</script>
	</body>
</html>
