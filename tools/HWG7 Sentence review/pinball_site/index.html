    <style>
        :root {
            color-scheme: light;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 10% 12%, rgba(255, 92, 168, 0.55) 0, rgba(255, 92, 168, 0) 24%),
                radial-gradient(circle at 86% 10%, rgba(45, 212, 255, 0.62) 0, rgba(45, 212, 255, 0) 24%),
                radial-gradient(circle at 82% 86%, rgba(190, 255, 52, 0.54) 0, rgba(190, 255, 52, 0) 24%),

            font-family: "Segoe UI", "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100dvh;
        }

        button, input {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .home-screen,
        .game-screen,
        .summary-screen,
        .teacher-screen {
            min-height: 100dvh;
            min-height: 100svh;
        }

        .home-card,
        .control-panel,
        .summary-card,
        .teacher-card {
            background: rgba(255, 255, 255, 0.91);
            border: 5px solid rgba(255, 244, 92, 0.95);
            box-shadow: 10px 10px 0 rgba(255, 0, 127, 0.34), 0 18px 42px rgba(15, 23, 42, 0.18);
        }

        .home-card {
            max-width: min(920px, calc(100vw - 32px));
        }

        .mode-grid {
            max-width: 760px;
        }

        .mode-card {
            min-height: 118px;
            border-radius: 22px;
            border-width: 4px;
            box-shadow: 4px 5px 0 rgba(15, 23, 42, 0.13);
        }

        .mode-card.is-selected {
            background: linear-gradient(135deg, #fff45c 0%, #ff8acb 50%, #5de7ff 100%);
            border-color: #ffffff;
            color: #111827;
            transform: translateY(-2px);
            box-shadow: 7px 8px 0 rgba(181, 0, 255, 0.28);
        }

        .mode-card.is-locked {
            background: rgba(255, 255, 255, 0.78);
        }

        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            gap: 18px;
        }

        .control-panel {
            scrollbar-width: thin;
            scrollbar-color: #ff5ca8 #ffe66d;
        }

        .question-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff8d7 100%);
            border-color: #5de7ff;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.56); }
            70% { transform: scale(1); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes popup-bounce {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.14); opacity: 1; }
            72% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes try-shake {
            0% { transform: rotate(-3deg) scale(0.75); opacity: 0; }
            35% { transform: rotate(3deg) scale(1.12); opacity: 1; }
            65% { transform: rotate(-2deg) scale(0.98); opacity: 1; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        @keyframes team-turn {
            0%, 100% { transform: rotateX(12deg) rotateY(-16deg) translateY(0); }
            50% { transform: rotateX(18deg) rotateY(18deg) translateY(-8px); }
        }

        @keyframes gentle-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .success-anim-active {
            animation: popup-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .try-anim-active {
            animation: try-shake 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .speaker-active {
            animation: pulse-ring 1.4s infinite;
        }

        .wood-board { fill: #FAEBD7; stroke: #DEB887; stroke-width: 4px; rx: 12px; }
        .wood-wall { fill: #ffcb5c; stroke: #ff8a00; stroke-width: 2px; }
        .wood-divider { fill: #ffcb5c; stroke: #ff8a00; stroke-width: 1.5px; }
        .peg-outer { fill: #fef3c7; stroke: #06b6d4; stroke-width: 1px; }
        .peg-inner { fill: #f5f5f5; }
        .score-text { font-size: 24px; font-weight: bold; fill: #8B5A2B; font-family: sans-serif; text-anchor: middle; opacity: 0.62; }
        .marble-pink { fill: url(#pinkGradient); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4)); }
        .marble-blue { fill: url(#blueGradient); filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.4)); }
        .marble-highlight { fill: white; opacity: 0.5; }
        .glass-cover { fill: rgba(255, 255, 255, 0.1); stroke: rgba(255,255,255,0.4); stroke-width: 2px; pointer-events: none; rx: 10px; }

        .team-icon {
            width: 88px;
            height: 88px;
            border-radius: 26px;
            position: relative;
            transform-style: preserve-3d;
            animation: team-turn 3.2s ease-in-out infinite;
            box-shadow: inset -12px -14px 22px rgba(0,0,0,0.22), inset 10px 10px 16px rgba(255,255,255,0.7), 0 18px 28px rgba(31,41,55,0.22);
        }

        .team-icon::before {
            content: "";
            position: absolute;
            width: 34px;
            height: 22px;
            border-radius: 999px;
            top: 18px;
            left: 20px;
            background: rgba(255,255,255,0.78);
            transform: rotate(-26deg);
        }

        .team-icon::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.38);
            transform: translateZ(14px);
        }

        .team-icon.pink {
            background: radial-gradient(circle at 30% 25%, #ffd6eb 0, #ff5ca8 42%, #b50059 100%);
        }

        .team-icon.blue {
            background: radial-gradient(circle at 30% 25%, #d4ffff 0, #21c7ff 42%, #006fb1 100%);
        }

        .result-badge {
            animation: gentle-float 2.8s ease-in-out infinite;
        }

        .pinball-shell {
            --board-scale: 1;
            width: 600px;
            height: 750px;
            zoom: var(--board-scale);
            transform-origin: top center;
        }

        @media (min-width: 900px) and (orientation: landscape) {
            .game-screen {
                display: grid !important;
                grid-template-columns: minmax(330px, 390px) calc(600px * var(--board-scale, 0.76));

                justify-content: center;
                padding: 12px 18px;

                max-height: calc(100svh - 24px);
            }

            .pinball-shell {
                --board-scale: 0.76;

            .game-screen {
                grid-template-columns: minmax(360px, 430px) calc(600px * var(--board-scale, 0.86));

                --board-scale: 0.86;
            }

            .game-screen {
                padding: 18px 22px;
                justify-content: flex-start;

                max-width: min(720px, calc(100vw - 36px)) !important;

            .pinball-shell {
                --board-scale: 0.72;
                margin-left: auto;
                margin-right: auto;
            }
        }

        @media (max-width: 760px) {
            .pinball-shell {
                --board-scale: 0.62;
            }

        @media (min-width: 900px) and (orientation: landscape) {

                max-width: 500px !important;
            }

                --board-scale: 0.72;

        function withAudioSources(question, type) {
            const audioNo = question.audioNo || question.id;
            const localAudio = `${LOCAL_AUDIO_DIR}${audioNo}.mp3`;
            const fallbackSources = question.audioId
                ? [DRIVE_AUDIO + question.audioId, LEGACY_DRIVE_AUDIO + question.audioId]
                : [];
            return {
                ...question,
                type,
                audioNo,
                audioUrl: localAudio,
                audioSources: [localAudio, ...fallbackSources]
            };
        }

            return MODE_META?.[mode]?.totalTurns
                || (mode?.endsWith("Phrases") ? PHRASE_TOTAL_TURNS : PHONICS_TOTAL_TURNS);
        }

        function getModeRoundsPerPlayer(mode) {
            return MODE_META?.[mode]?.roundsPerPlayer || getModeTotalTurns(mode) / 2;
        }

        function shuffle(items) {
            const arr = [...items];
            for (let i = arr.length - 1; i > 0; i -= 1) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function pickRandom(items) {
            return items[Math.floor(Math.random() * items.length)];
        }

        function createBalancedSlotPlan(totalTurns = PHONICS_TOTAL_TURNS) {
            if (!Number.isInteger(totalTurns) || totalTurns <= 0 || totalTurns % 2 !== 0) {
                throw new Error("總回合數必須是正偶數，才能讓兩位玩家回合數相同。");
            }
            const roundsPerPlayer = totalTurns / 2;
            const equalScorePairs = [
                [0, 5],
                [1, 4],
                [2, 3],
                [5, 0],
                [4, 1],
                [3, 2]
            ];
            const pairedRounds = equalScorePairs.slice(0, Math.min(6, Math.max(0, roundsPerPlayer - 1)));

            while (pairedRounds.length < roundsPerPlayer - 1) {
                pairedRounds.push(pickRandom(equalScorePairs));
            }

            const pinkWinsFinal = Math.random() < 0.5;
            const winningSlot = pickRandom([0, 5]);
            const closeSlot = pickRandom([1, 4]);
            pairedRounds.push(pinkWinsFinal ? [winningSlot, closeSlot] : [closeSlot, winningSlot]);

            return pairedRounds.flatMap(([pinkSlot, blueSlot], roundIndex) => ([
                { team: "pink", round: roundIndex + 1, slotIndex: pinkSlot },
                { team: "blue", round: roundIndex + 1, slotIndex: blueSlot }
            ]));
        }

        function prepareQuestionSet(mode) {
            const source = QUESTION_BANKS[mode] || QUESTION_BANKS.grade4Phonics;
            if (mode === SPEECH_MODE) {
                const readAloud = shuffle(source.filter(question => question.type === "read_aloud")).slice(0, 6);
                const questionAnswer = shuffle(source.filter(question => question.type === "question_answer")).slice(0, 6);
                if (readAloud.length !== 6 || questionAnswer.length !== 6) return [];
                return readAloud.flatMap((question, index) => [question, questionAnswer[index]]).map(question => ({
                    ...question,
                    acceptableAnswers: [...(question.acceptableAnswers || [])],
                    pronunciationTargets: [...(question.pronunciationTargets || [])],
                    difficultWords: [...(question.difficultWords || [])]
                }));
            }
            const selected = shuffle(source).slice(0, getModeTotalTurns(mode));
            if (mode.endsWith("Phrases")) {
                const allAnswers = [...new Set(source.filter(q => q.optionType !== "image").map(q => q.correctAnswer))];
                return selected.map(q => {
                    if (q.optionType === "image") {
                        return { ...q, options: q.options.map(option => ({ ...option })) };
                    }
                    const distractors = shuffle(allAnswers.filter(answer => answer !== q.correctAnswer)).slice(0, 2);
                    return { ...q, options: shuffle([q.correctAnswer, ...distractors]), correctOption: q.correctAnswer };
                });
            }
            return selected.map(q => ({ ...q, options: [...q.options] }));
        }

        function playRollingAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const duration = 6.0;
            const bufferSize = ctx.sampleRate * duration;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i += 1) {
                output[i] = (Math.random() * 2 - 1) * 0.08;
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.value = 250;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(1, ctx.currentTime + 0.2);
            gain.gain.linearRampToValueAtTime(0.8, ctx.currentTime + duration - 1);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();

            for (let i = 0; i < 25; i += 1) {
                const clackTime = ctx.currentTime + 0.2 + Math.random() * 5.0;
                const osc = ctx.createOscillator();
                const clackGain = ctx.createGain();
                osc.type = "triangle";
                osc.frequency.setValueAtTime(300 + Math.random() * 400, clackTime);
                osc.frequency.exponentialRampToValueAtTime(100, clackTime + 0.05);
                clackGain.gain.setValueAtTime(0, clackTime);
                clackGain.gain.linearRampToValueAtTime(0.4, clackTime + 0.01);
                clackGain.gain.exponentialRampToValueAtTime(0.001, clackTime + 0.1);
                osc.connect(clackGain);
                clackGain.connect(ctx.destination);
                osc.start(clackTime);
                osc.stop(clackTime + 0.1);
            }

            setTimeout(() => ctx.close(), (duration + 0.4) * 1000);
        }

        function playRepeatedEffectAudio(src, repeatCount = 1, volume = 0.9) {
            const audio = new Audio(src);

        function GamePage({ config, onFinish, onHome }) {
            const totalTurns = config.totalTurns || getModeTotalTurns(config.mode);

            const engineRef = useRef(null);

            const marblesStateRef = useRef([]);
            const answersRef = useRef({ pink: [], blue: [] });

            const finalFallbackRef = useRef(null);

            if (!slotPlanRef.current || slotPlanRef.current.length !== totalTurns) {

            }

            const currentQuestion = config.questions[turnIndex] || null;

            const isImagePractice = isSpeechPractice || config.questions.some(q => q.optionType === "image");
            const showQuestionStem = Boolean(currentQuestion?.stem?.trim());

            const finishGame = useCallback((finalScores = scoreRef.current) => {
                if (finishedRef.current) return;
                finishedRef.current = true;
                if (finalFallbackRef.current) clearTimeout(finalFallbackRef.current);
                const playedAt = new Date();
                const result = {
                    id: `${playedAt.getTime()}-${Math.random().toString(16).slice(2)}`,
                    playedAt: playedAt.toISOString(),
                    date: todayString(),
                    mode: config.mode,
                    modeLabel: MODE_META[config.mode].label,
                    students: config.students,
                    teams: config.teams,

                    answers: answersRef.current,
                    questions: config.questions.map(q => ({
                        id: q.id,
                        type: q.type || q.optionType,

                        imagePath: q.imagePath || "",
                        correctAnswer: q.correctAnswer,

                    })),

                };
                onFinish(result);
            }, [config, onFinish]);

            useEffect(() => {
                finishRef.current = finishGame;
            }, [finishGame]);

            useEffect(() => {
                const engine = Engine.create();
                engine.world.gravity.y = 1.2;
                engineRef.current = engine;

                const staticBodies = [];
                staticBodies.push(Bodies.rectangle(10, 375, 20, 750, { isStatic: true }));
                staticBodies.push(Bodies.rectangle(590, 375, 20, 750, { isStatic: true }));
                staticBodies.push(Bodies.rectangle(300, 740, 600, 20, { isStatic: true }));
                staticBodies.push(Bodies.rectangle(300, 10, 600, 20, { isStatic: true }));
                staticBodies.push(Bodies.rectangle(510, 465, 20, 530, { isStatic: true }));
                staticBodies.push(Bodies.rectangle(550, 60, 150, 20, { isStatic: true, angle: Math.PI / 3.5, friction: 0, restitution: 0.2 }));
                staticBodies.push(Bodies.rectangle(400, 25, 200, 20, { isStatic: true, angle: Math.PI / 32, friction: 0, restitution: 0.1 }));
                staticBodies.push(Bodies.rectangle(200, 25, 200, 20, { isStatic: true, angle: -Math.PI / 32, friction: 0, restitution: 0.1 }));

                for (let i = 1; i <= 5; i += 1) {
                    const divX = 20 + i * 80;
                    staticBodies.push(Bodies.rectangle(divX, 650, 8, 160, { isStatic: true, restitution: 0.2 }));
                }

                for (let r = 0; r < 7; r += 1) {
                    const isEvenRow = r % 2 === 0;
                    const cols = isEvenRow ? 5 : 6;
                    const startX = isEvenRow ? 100 : 60;
                    const yPos = 150 + r * 60;
                    for (let c = 0; c < cols; c += 1) {
                        const xPos = startX + c * 80;
                        staticBodies.push(Bodies.circle(xPos, yPos, 6, { isStatic: true, restitution: 0.4, friction: 0.001 }));
                    }
                }

                for (let i = 0; i < 6; i += 1) {
                    const sensorX = 60 + i * 80;
                    staticBodies.push(Bodies.rectangle(sensorX, 650, 70, 140, {
                        isStatic: true,
                        isSensor: true,
                        label: "scoreSensor",
                        slotIndex: i
                    }));
                }

                Composite.add(engine.world, staticBodies);

                Events.on(engine, "beforeUpdate", () => {
                    marblesStateRef.current.forEach(m => {
                        const body = m.body;
                        if (body.position.x < 500 && body.position.y > 50 && body.position.y < 650 && body.targetSlot !== undefined) {
                            const targetX = SLOT_CENTERS[body.targetSlot];
                            const dx = targetX - body.position.x;
                            if (body.position.y > 520 && !body.hasScored) {
                                const laneVx = Math.max(-5.2, Math.min(5.2, dx * 0.09));
                                const nextX = body.position.x + Math.max(-3.2, Math.min(3.2, dx * 0.08));
                                Body.setVelocity(body, {
                                    x: body.velocity.x * 0.35 + laneVx * 0.65,
                                    y: Math.max(body.velocity.y, 1.8)
                                });
                                if (Math.abs(dx) > 10) {
                                    Body.setPosition(body, { x: nextX, y: body.position.y });
                                }
                            } else if (body.position.y < 150) {
                                let desiredVx = dx * 0.1;
                                desiredVx = Math.max(-12, Math.min(12, desiredVx));
                                const newVx = body.velocity.x * 0.85 + desiredVx * 0.15;
                                let newVy = body.velocity.y;
                                if (Math.abs(dx) > 20 && body.velocity.y > 0) newVy *= 0.7;
                                Body.setVelocity(body, { x: newVx, y: newVy });
                            } else {
                                let forceX = dx * 0.000065;
                                forceX = Math.max(-0.0032, Math.min(0.0032, forceX));
                                let forceY = 0;
                                if (Math.abs(body.velocity.y) < 0.3) {
                                    forceY = 0.002;
                                    forceX += (Math.random() - 0.5) * 0.0025;
                                }
                                Body.applyForce(body, body.position, { x: forceX, y: forceY });
                            }
                        }
                    });
                });

                Events.on(engine, "collisionStart", event => {
                    event.pairs.forEach(pair => {
                        const { bodyA, bodyB } = pair;
                        const sensor = bodyA.label === "scoreSensor" ? bodyA : (bodyB.label === "scoreSensor" ? bodyB : null);
                        const marble = bodyA.label === "marble" ? bodyA : (bodyB.label === "marble" ? bodyB : null);
                        if (sensor && marble && !marble.hasScored) {
                            marble.hasScored = true;
                            scoredCountRef.current += 1;
                            const pts = SLOT_SCORES[sensor.slotIndex];
                            const nextScores = {
                                ...scoreRef.current,
                                [marble.team]: scoreRef.current[marble.team] + pts
                            };
                            scoreRef.current = nextScores;
                            setScores(nextScores);
                            if (launchedCountRef.current >= totalTurns && scoredCountRef.current >= totalTurns) {
                                setTimeout(() => finishRef.current && finishRef.current(nextScores), 700);
                            }
                        }
                    });
                });

                const runner = Runner.create();
                Runner.run(runner, engine);
                runnerRef.current = runner;

                const updateDOM = () => {
                    marblesStateRef.current.forEach(m => {
                        const circle = document.getElementById(m.id);
                        if (circle) {
                            circle.setAttribute("cx", m.body.position.x);
                            circle.setAttribute("cy", m.body.position.y);
                            const highlight = document.getElementById(`${m.id}-hl`);
                            if (highlight) {
                                highlight.setAttribute("cx", m.body.position.x - 4);
                                highlight.setAttribute("cy", m.body.position.y - 4);
                            }
                        }
                    });
                    animationRef.current = requestAnimationFrame(updateDOM);
                };
                updateDOM();

                return () => {
                    if (finalFallbackRef.current) clearTimeout(finalFallbackRef.current);
                    if (audioRef.current) audioRef.current.pause();
                    speechRecorderRef.current?.cancel?.();
                    speechRecorderRef.current = null;
                    speechEvaluationAbortRef.current?.abort?.();
                    speechEvaluationAbortRef.current = null;
                    if (speechPlaybackUrlRef.current) URL.revokeObjectURL(speechPlaybackUrlRef.current);
                    speechPlaybackUrlRef.current = "";
                    cancelAnimationFrame(animationRef.current);
                    Runner.stop(runner);
                    Engine.clear(engine);
                };
            }, []);

            useEffect(() => {
                setSelectedOption("");
                setAudioStatus("");
                setAudioReadyForAnswer(false);
                setSpeechStatus("idle");
                setSpeechMessage("");
                setSpeechResult(null);
                setIsLaunchReady(false);
                speechRecorderRef.current?.cancel?.();
                speechRecorderRef.current = null;
                speechEvaluationAbortRef.current?.abort?.();
                speechEvaluationAbortRef.current = null;
                if (speechPlaybackUrlRef.current) URL.revokeObjectURL(speechPlaybackUrlRef.current);
                speechPlaybackUrlRef.current = "";
                setSpeechPlaybackUrl("");
                if (currentQuestion) {
                    setFeedback(isSpeechPractice ? "看圖並按下錄音，完成後系統會依固定公式評分。" : "請先按喇叭聽音檔，再選答案。");
                }
            }, [currentQuestion?.id, isSpeechPractice]);

            const playQuestionAudio = useCallback(() => {
                if (!currentQuestion) return;
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                }
                setAudioReadyForAnswer(false);
                const sources = currentQuestion.audioSources?.length
                    ? currentQuestion.audioSources
                    : [currentQuestion.audioUrl].filter(Boolean);

                const playSource = sourceIndex => {
                    if (sourceIndex >= sources.length) {
                        setAudioStatus("音檔暫時無法播放，請確認 audio 資料夾已重新部署，或再點一次喇叭。");
                        setFeedback("音檔還沒有完整播放，請先確認喇叭可以播放。");
                        return;
                    }

                    const audio = audioElementRef.current || new Audio();
                    audio.pause();
                    audio.src = sources[sourceIndex];
                    audio.preload = "auto";
                    audio.playsInline = true;
                    audioRef.current = audio;
                    setAudioStatus(sourceIndex === 0 ? "播放中..." : "播放中...（雲端備援）");
                    setFeedback("音檔播放中，請聽完後再選答案。");

                    let movedToNextSource = false;
                    const tryNextSource = () => {
                        if (movedToNextSource) return;
                        movedToNextSource = true;
                        audio.pause();
                        if (audioRef.current === audio) {
                            playSource(sourceIndex + 1);
                        }
                    };

                    audio.onended = () => {
                        if (audioRef.current === audio) {
                            setAudioReadyForAnswer(true);
                            setAudioStatus("音檔播放完畢");
                            setFeedback("音檔播放完畢，可以選答案。");
                        }
                    };
                    audio.onerror = tryNextSource;
                    audio.load();
                    audio.play().catch(error => {
                        if (error?.name === "NotAllowedError") {
                            setAudioReadyForAnswer(false);
                            setAudioStatus("瀏覽器暫時擋下播放，請再點一次喇叭。");
                            setFeedback("請再點一次喇叭，音檔完整播放後才能選答案。");
                            return;
                        }
                        tryNextSource();
                    });
                };

                playSource(0);
            }, [currentQuestion]);

            const saveSpeechResult = (apiResult, attemptNo) => {
                const questionId = currentQuestion.id;
                const history = [...(speechHistoryRef.current[questionId] || []), {
                    attemptNo,
                    transcript: apiResult.transcript,
                    scores: apiResult.scores,
                    feedback: apiResult.feedback,
                    primaryIssue: apiResult.primaryIssue,
                    matchedAnswer: apiResult.matchedAnswer || null,
                    valid: apiResult.valid === true
                }];
                speechHistoryRef.current[questionId] = history;
                const bestAttempt = history.reduce((best, item) => !best || item.scores.total > best.scores.total ? item : best, null);
                const passed = Boolean(apiResult.passed) && Number(apiResult.scores?.total) >= modeMeta.passScore;
                const exhausted = attemptNo >= modeMeta.maxAttempts;
                const status = passed ? "passed" : (exhausted ? "not_met" : "retry");
                const entry = {
                    id: questionId,
                    type: currentQuestion.type,
                    stem: currentQuestion.stem,
                    correctAnswer: currentQuestion.correctAnswer,
                    imagePath: currentQuestion.imagePath,
                    transcript: apiResult.transcript,
                    scores: apiResult.scores,
                    bestScore: bestAttempt?.scores?.total || 0,
                    passScore: modeMeta.passScore,
                    status,
                    forcedLaunch: status === "not_met",
                    feedback: apiResult.feedback,
                    attempts: history,
                    rubricVersion: apiResult.rubricVersion || currentQuestion.rubricVersion,
                    questionBankVersion: currentQuestion.questionBankVersion || "hwg7-sr-v1-draft",
                    mode: config.mode
                };
                const withoutCurrent = answersRef.current[currentTeam].filter(item => item.id !== questionId);
                answersRef.current = { ...answersRef.current, [currentTeam]: [...withoutCurrent, entry] };
                setCorrectLog(answersRef.current);
                setSpeechResult({ ...apiResult, attemptNo, exhausted, status, bestScore: entry.bestScore });
                if (passed) {
                    setFeedback(`達標！本次 ${apiResult.scores.total} 分，可以發射。`);
                    setIsLaunchReady(true);
                    setShowSuccess(true);
                    playCorrectAnswerAudio();
                    setTimeout(() => setShowSuccess(false), 1900);
                } else if (exhausted) {
                    setFeedback("本題三次都未達80分，已記錄為未達標；請看正確示範後發射。");
                    setIsLaunchReady(true);
                } else {
                    setFeedback(`本次 ${apiResult.scores.total} 分，還可以再試 ${modeMeta.maxAttempts - attemptNo} 次。`);
                    setShowTryAgain(true);
                    setTimeout(() => setShowTryAgain(false), 1400);
                }
            };

            const handleSpeechRecord = async () => {
                if (!currentQuestion || isLaunchReady || finalWaiting || speechStatus === "evaluating" || speechStatus === "requesting") return;
                if (speechStatus === "recording" || speechStatus === "stopping") {
                    speechRecorderRef.current?.stop?.();
                    return;
                }
                const completedAttempts = speechHistoryRef.current[currentQuestion.id]?.length || 0;
                if (completedAttempts >= modeMeta.maxAttempts) return;
                setSpeechResult(null);
                setSpeechStatus("requesting");
                setSpeechMessage("正在開啟麥克風...");
                const controller = window.SpeechPractice.createRecorder({
                    questionType: currentQuestion.type,
                    onStatus: status => {
                        setSpeechStatus(status.state);
                        setSpeechMessage(status.message || "");
                    },
                    onError: error => {
                        setSpeechStatus("idle");
                        setSpeechMessage(error.message);
                        setFeedback(error.message);
                        speechRecorderRef.current = null;
                    },
                    onComplete: async recording => {
                        speechRecorderRef.current = null;
                        if (speechPlaybackUrlRef.current) URL.revokeObjectURL(speechPlaybackUrlRef.current);
                        const playbackUrl = URL.createObjectURL(recording.blob);
                        speechPlaybackUrlRef.current = playbackUrl;
                        setSpeechPlaybackUrl(playbackUrl);
                        setSpeechStatus("evaluating");
                        setSpeechMessage("正在辨識與計算分數，不會傳送學生代碼。");
                        const evaluationController = new AbortController();
                        speechEvaluationAbortRef.current?.abort?.();
                        speechEvaluationAbortRef.current = evaluationController;
                        try {
                            const apiResult = await window.SpeechPractice.evaluateSpeech({
                                questionId: currentQuestion.id,
                                blob: recording.blob,
                                mimeType: recording.mimeType,
                                metrics: recording.metrics,
                                signal: evaluationController.signal
                            });
                            if (apiResult.valid !== true || !Number.isFinite(Number(apiResult.scores?.total))) {
                                throw new Error("這次沒有形成可評分的英文內容，請再說一次。");
                            }
                            const attemptNo = (speechHistoryRef.current[currentQuestion.id]?.length || 0) + 1;
                            setAttemptMap(previous => ({ ...previous, [currentQuestion.id]: attemptNo }));
                            saveSpeechResult(apiResult, attemptNo);
                            setSpeechStatus("idle");
                            setSpeechMessage("");
                        } catch (error) {
                            const message = error?.name === "AbortError" ? "評測已取消。" : error.message;
                            setSpeechStatus("idle");
                            setSpeechMessage(message);
                            setFeedback(`${message} 這次不計入有效次數。`);
                        } finally {
                            if (speechEvaluationAbortRef.current === evaluationController) {
                                speechEvaluationAbortRef.current = null;
                            }
                        }
                    }
                });
                speechRecorderRef.current = controller;
                await controller.start();
            };

            const handleAnswer = option => {
                if (!currentQuestion || isLaunchReady || finalWaiting) return;
                if (!audioReadyForAnswer) {
                    setFeedback("請先按喇叭，等音檔完整播放完畢後再選答案。");
                    return;
                }
                setSelectedOption(option);
                const correct = option === currentQuestion.correctOption;
                if (correct) {
                    const entry = {
                        id: currentQuestion.id,
                        stem: currentQuestion.stem,
                        correctAnswer: currentQuestion.correctAnswer,
                        correctOption: currentQuestion.correctOption,
                        audioNo: currentQuestion.audioNo,
                        mode: config.mode
                    };
                    answersRef.current = {
                        ...answersRef.current,
                        [currentTeam]: [...answersRef.current[currentTeam], entry]
                    };
                    setCorrectLog(answersRef.current);
                    setFeedback("答對了，可以按發射。");
                    setIsLaunchReady(true);
                    setShowSuccess(true);
                    playCorrectAnswerAudio();
                    setTimeout(() => setShowSuccess(false), 1900);
                } else {
                    const nextAttempts = (attemptMap[currentQuestion.id] || 0) + 1;
                    setAttemptMap(prev => ({ ...prev, [currentQuestion.id]: nextAttempts }));
                    if (nextAttempts === 1) {
                        setFeedback("Try Again，還有第二次機會。");
                        setShowTryAgain(true);
                        setTimeout(() => setShowTryAgain(false), 1400);
                    } else {
                        setFeedback(`再聽一次音檔，選到正確答案後才能發射。`);
                    }
                }
            };

            const handleLaunchClick = useCallback(() => {
                if (!engineRef.current || !isLaunchReady || turnIndex >= totalTurns) return;
                playRollingAudio();
                const team = currentTeam;
                const startX = 550;
                const startY = 700;
                const id = `marble-${Date.now()}-${turnIndex}`;
                const plannedTurn = slotPlanRef.current?.[turnIndex] || { slotIndex: pickRandom([0, 1, 2, 3, 4, 5]) };
                const targetSlot = plannedTurn.slotIndex;

                const marbleBody = Bodies.circle(startX, startY, 12, {
                    label: "marble",
                    restitution: 0.4,
                    friction: 0.001,
                    density: 0.05
                });
                marbleBody.team = team;
                marbleBody.hasScored = false;
                marbleBody.targetSlot = targetSlot;
                marbleBody.plannedRound = plannedTurn.round;
                marbleBody.turnIndex = turnIndex;
                Body.setVelocity(marbleBody, { x: 0, y: -43 });
                Composite.add(engineRef.current.world, marbleBody);
                marblesStateRef.current.push({ id, body: marbleBody, team });
                setMarbles(prev => [...prev, { id, team }]);

                launchedCountRef.current += 1;
                setIsLaunchReady(false);
                setTurnIndex(prev => prev + 1);
                if (launchedCountRef.current >= totalTurns) {
                    setFinalWaiting(true);
                    setFeedback("等待最後一顆彈珠計分...");
                    finalFallbackRef.current = setTimeout(() => {
                        if (finishRef.current) finishRef.current(scoreRef.current);
                    }, 12000);
                }
            }, [isLaunchReady, turnIndex, currentTeam, totalTurns]);

            const optionButtonClass = (option, disabled, imageOption = false) => {
                const isSelected = selectedOption === option;
                const base = imageOption
                    ? "image-option-button min-h-[142px] rounded-xl border-4 p-2 font-black transition-all shadow-sm flex flex-col items-center justify-center"
                    : "min-h-[58px] rounded-xl border-4 px-4 py-3 font-black text-xl transition-all shadow-sm";
                if (isLaunchReady && option === currentQuestion?.correctOption) {
                    return `${base} bg-green-100 border-green-400 text-green-700`;
                }
                if (disabled) {
                    return `${base} bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed opacity-70`;
                }
                if (isSelected && !isLaunchReady) {
                    return `${base} bg-pink-100 border-pink-400 text-pink-700`;
                }
                return `${base} bg-white border-cyan-200 text-slate-800 hover:border-cyan-500 hover:bg-cyan-50`;
            };

            const answerButtonsDisabled = !audioReadyForAnswer || isLaunchReady || finalWaiting;

            return (
                <div className={`game-screen ${isImagePractice ? "image-practice-screen" : ""}`}>
                    <OverlayFeedback showSuccess={showSuccess} showTryAgain={showTryAgain} />

                    <section className={`control-panel w-full ${isImagePractice ? "max-w-[500px]" : "max-w-[430px]"} max-h-[calc(100svh-2rem)] overflow-y-auto flex flex-col gap-5 backdrop-blur-md p-5 md:p-6 rounded-[28px] relative z-10`}>
                        <div className="flex items-center justify-between gap-3">
                            <div>
                                <p className="text-sm font-black text-purple-600">{modeMeta.label}</p>
                                <h2 className="text-2xl font-black text-slate-900">第 {Math.min(currentRound, roundsPerPlayer)} 回合</h2>
                            </div>
                            <button onClick={onHome} className="rounded-lg bg-slate-100 px-3 py-2 font-black text-slate-700 hover:bg-slate-200">
                                <i className="fas fa-house mr-1"></i>
                                首頁
                            </button>
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <TeamScoreCard team="pink" name={config.teams.pink} score={scores.pink} />
                            <TeamScoreCard team="blue" name={config.teams.blue} score={scores.blue} />
                        </div>

                        <div className="rounded-2xl border-4 border-purple-200 bg-purple-50 p-4 text-center">
                            <p className="text-sm font-black text-purple-600">目前作答</p>
                            <p className={`text-3xl font-black ${currentTeam === "pink" ? "text-pink-600" : "text-blue-600"}`}>
                                {currentTeam === "pink" ? "粉紅隊" : "藍隊"}・{currentPlayer || "等待計分"}
                            </p>
                            <p className="text-sm font-bold text-slate-500 mt-1">第 {Math.min(turnIndex + 1, totalTurns)} 題 / 共 {totalTurns} 題</p>
                        </div>

                        {currentQuestion ? (
                            <div className="question-card rounded-2xl border-4 p-4">
                                <audio ref={audioElementRef} preload="auto" playsInline></audio>
                                {isSpeechPractice ? (
                                    <div className="grid gap-4">
                                        <img src={currentQuestion.imagePath} alt={currentQuestion.imageAlt || "題目圖片（替代文字待教師確認）"} className="w-full max-h-56 object-contain rounded-xl bg-white border-4 border-cyan-100" draggable="false" />
                                        <div className="text-center rounded-2xl bg-yellow-50 border-4 border-yellow-200 p-4">
                                            <p className="text-sm font-black text-purple-600">{currentQuestion.type === "read_aloud" ? "Look and read" : "Read and answer"}</p>
                                            <p className="text-2xl font-black text-slate-900 mt-2 leading-snug">{currentQuestion.type === "read_aloud" ? currentQuestion.standardReadSentence : currentQuestion.questionText}</p>
                                            {currentQuestion.type === "question_answer" && <p className="text-sm font-bold text-slate-600 mt-2">請先讀問句，再說出答案；短答或完整答都可依題庫得滿分。</p>}
                                        </div>
                                        <details className="rounded-xl border-2 border-purple-200 bg-white px-4 py-3 text-left">
                                            <summary className="cursor-pointer font-black text-purple-700">評分公式與本題提醒</summary>
                                            <div className="mt-2 grid gap-2 text-sm font-bold text-slate-700">
                                                <p>{currentQuestion.type === "read_aloud" ? "總分＝準確度×40%＋完整度×35%＋流暢度×25%。" : "總分＝準確度×50%＋完整度×30%＋流暢度×20%；核心答案錯誤時最高59分。"}</p>
                                                <p>總分達80分即達標；最多3次有效作答。錄音或系統失敗不計次數，3次未達標仍可看示範並發射。</p>
                                                {currentQuestion.pronunciationTargets?.length > 0 && <p>本題留意：{currentQuestion.pronunciationTargets.join("、")}。評語會依題庫的發音難字與語調分析選出一項主要提醒。</p>}
                                            </div>
                                        </details>
                                        <div className="grid grid-cols-2 gap-3 items-center">
                                            <button onClick={handleSpeechRecord} disabled={isLaunchReady || finalWaiting || speechStatus === "evaluating" || speechStatus === "requesting"} className={`min-h-[64px] rounded-xl border-4 px-4 py-3 text-xl font-black text-white transition-all ${speechStatus === "recording" || speechStatus === "stopping" ? "bg-red-600 border-red-200 animate-pulse" : "bg-gradient-to-r from-pink-500 to-purple-600 border-white"} disabled:bg-slate-300 disabled:border-slate-200`}>
                                                <i className={`fas ${speechStatus === "recording" || speechStatus === "stopping" ? "fa-stop" : "fa-microphone"} mr-2`}></i>
                                                {speechStatus === "recording" || speechStatus === "stopping" ? "停止錄音" : "開始錄音"}
                                            </button>
                                            <div className="rounded-xl bg-white border-4 border-slate-100 p-3 text-center">
                                                <p className="text-sm font-black text-slate-500">有效次數</p>
                                                <p className="text-2xl font-black text-slate-900">{attemptMap[currentQuestion.id] || 0} / {modeMeta.maxAttempts}</p>
                                            </div>
                                        </div>
                                        {speechMessage && <p className="rounded-xl bg-cyan-50 border-2 border-cyan-200 p-3 text-center font-black text-cyan-800">{speechMessage}</p>}
                                        {speechPlaybackUrl && <audio src={speechPlaybackUrl} controls playsInline className="w-full" />}
                                        {speechResult && (
                                            <div className={`rounded-2xl border-4 p-4 ${speechResult.status === "passed" ? "bg-green-50 border-green-300" : "bg-orange-50 border-orange-300"}`}>
                                                <p className="text-sm font-black text-slate-500">系統聽到</p>
                                                <p className="font-black text-slate-900 mt-1">{speechResult.transcript}</p>
                                                <div className="grid grid-cols-4 gap-2 mt-3 text-center">
                                                    {[["準確", speechResult.scores.accuracy], ["完整", speechResult.scores.completeness], ["流暢", speechResult.scores.fluency], ["總分", speechResult.scores.total]].map(([label, value]) => (
                                                        <div key={label} className="rounded-lg bg-white p-2 border border-slate-200"><p className="text-xs font-black text-slate-500">{label}</p><p className="text-xl font-black text-purple-700">{value}</p></div>
                                                    ))}
                                                </div>
                                                <p className="mt-3 font-black text-slate-800">口說小提醒：{speechResult.feedback}</p>
                                                {speechResult.status === "not_met" && speechResult.exhausted && (
                                                    <div className="mt-3 rounded-xl bg-white border-2 border-orange-200 p-3">
                                                        <p className="text-sm font-black text-orange-700">正確示範</p>
                                                        <p className="text-lg font-black text-slate-900">{currentQuestion.type === "read_aloud" ? currentQuestion.standardReadSentence : currentQuestion.acceptableAnswers.map(answer => answer.text || answer).join("／")}</p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        <div className={`rounded-xl border-2 px-3 py-2 text-center font-black ${isLaunchReady ? "bg-green-50 border-green-300 text-green-700" : "bg-purple-50 border-purple-200 text-purple-700"}`}>{feedback}</div>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-center mb-4">
                                            <button onClick={playQuestionAudio} className={`w-24 h-24 rounded-full border-4 border-white bg-gradient-to-br from-yellow-400 via-pink-500 to-cyan-500 text-white text-4xl shadow-[0_0_20px_rgba(0,184,255,0.45)] hover:scale-105 active:scale-95 transition-transform ${audioStatus.startsWith("播放中") ? "speaker-active" : ""}`} aria-label="播放題目音檔"><i className="fas fa-volume-up"></i></button>
                                        </div>
                                        <div className="text-center mb-4">
                                            <p className="text-sm font-black text-slate-500">音檔編號 {currentQuestion.audioNo}</p>
                                            {showQuestionStem && <div className="mt-2 min-h-[82px] rounded-2xl bg-yellow-50 border-4 border-yellow-200 flex items-center justify-center px-4"><p className={`${config.mode.endsWith("Phonics") ? "text-5xl" : "text-2xl"} font-black text-slate-900 leading-tight`}>{currentQuestion.stem}</p></div>}
                                        </div>
                                        <div className={currentQuestion.optionType === "image" ? "image-options-grid grid grid-cols-3 gap-2" : "grid gap-3"}>
                                            {currentQuestion.options.map(option => {
                                                const optionValue = getOptionValue(option);
                                                const imageOption = typeof option === "object" && option.image;
                                                return <button key={optionValue} onClick={() => handleAnswer(optionValue)} disabled={answerButtonsDisabled} className={optionButtonClass(optionValue, answerButtonsDisabled, imageOption)}>{imageOption ? <><img src={option.image} alt={`${currentQuestion.id} 選項 ${option.label}`} className="w-full aspect-square object-contain rounded-lg bg-white" draggable="false" /><span className="mt-1 text-sm text-slate-700">{option.label}</span></> : option}</button>;
                                            })}
                                        </div>
                                        <div className={`mt-4 rounded-xl border-2 px-3 py-2 text-center font-black ${isLaunchReady ? "bg-green-50 border-green-300 text-green-700" : "bg-purple-50 border-purple-200 text-purple-700"}`}>{feedback}</div>
                                        {audioStatus && <p className="text-center text-sm font-bold text-slate-500 mt-2">{audioStatus}</p>}
                                    </>
                                )}
                            </div>
                        ) : (

                            <div className="rounded-2xl border-4 border-slate-200 bg-white p-6 text-center">
                                <p className="text-2xl font-black text-slate-900">彈珠計分中</p>
                                <p className="text-sm font-bold text-slate-500 mt-2">所有題目都已完成，等待最後分數。</p>
                            </div>
                        )}
                    </section>

                    <section className="pinball-shell relative shadow-[12px_12px_0px_0px_rgba(181,0,255,0.36)] rounded-[28px] overflow-hidden border-[12px] border-[#B500FF] bg-[#FFFFB3]">
                        <svg width={BOARD_W} height={BOARD_H} xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="pinkGradient" cx="30%" cy="30%" r="70%">
                                    <stop offset="0%" stopColor="#ff99cc" />
                                    <stop offset="50%" stopColor="#ff007f" />
                                    <stop offset="100%" stopColor="#99004c" />
                                </radialGradient>
                                <radialGradient id="blueGradient" cx="30%" cy="30%" r="70%">
                                    <stop offset="0%" stopColor="#99ffff" />
                                    <stop offset="50%" stopColor="#00ccff" />
                                    <stop offset="100%" stopColor="#006699" />
                                </radialGradient>
                                <filter id="inner-shadow">
                                    <feOffset dx="0" dy="5" />
                                    <feGaussianBlur stdDeviation="3" result="offset-blur" />
                                    <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
                                    <feFlood floodColor="#FF3399" floodOpacity="0.4" result="color" />
                                    <feComposite operator="in" in="color" in2="inverse" result="shadow" />
                                    <feComposite operator="over" in="shadow" in2="SourceGraphic" />
                                </filter>
                            </defs>

                            <rect x="0" y="0" width={BOARD_W} height={BOARD_H} className="wood-board" />
                            <text x="560" y="600" fill="#B500FF" fontSize="26" fontWeight="900" fontFamily="Arial" opacity="1" transform="rotate(-90 560 600)">
                                READY GO
                            </text>
                            <rect x="0" y="0" width="20" height={BOARD_H} className="wood-wall" />
                            <rect x={BOARD_W - 20} y="0" width="20" height={BOARD_H} className="wood-wall" />
                            <rect x="0" y={BOARD_H - 20} width={BOARD_W} height="20" className="wood-wall" />
                            <rect x="0" y="0" width={BOARD_W} height="20" className="wood-wall" />
                            <rect x="500" y="200" width="20" height="530" className="wood-wall" rx="10" />
                            <path d="M 580 150 Q 580 20 400 20 L 580 20 Z" fill="#FF3399" stroke="#FF99CC" strokeWidth="2" opacity="1" />

                            {SLOT_SCORES.map((score, i) => (
                                <g key={`score-${i}`}>
                                    <rect x={20 + i * 80} y="700" width="80" height="30" fill="#FFEA00" filter="url(#inner-shadow)" />
                                    <text x={60 + i * 80} y="724" className="score-text">{score}</text>
                                </g>
                            ))}

                            {[1, 2, 3, 4, 5].map(i => (
                                <rect key={`div-${i}`} x={20 + i * 80 - 4} y="570" width="8" height="160" className="wood-divider" rx="4" />
                            ))}

                            {(() => {
                                const pegs = [];
                                for (let r = 0; r < 7; r += 1) {
                                    const isEven = r % 2 === 0;
                                    const cols = isEven ? 5 : 6;
                                    const startX = isEven ? 100 : 60;
                                    for (let c = 0; c < cols; c += 1) {
                                        const cx = startX + c * 80;
                                        const cy = 150 + r * 60;
                                        pegs.push(
                                            <g key={`peg-${r}-${c}`}>
                                                <circle cx={cx} cy={cy} r="7" className="peg-outer" />
                                                <circle cx={cx - 1} cy={cy - 1} r="3" className="peg-inner" />
                                            </g>
                                        );
                                    }
                                }
                                return pegs;
                            })()}

                            {marbles.map(m => (
                                <g key={m.id}>
                                    <circle id={m.id} cx="-100" cy="-100" r="12" className={m.team === "pink" ? "marble-pink" : "marble-blue"} />
                                    <circle id={`${m.id}-hl`} cx="-100" cy="-100" r="4" className="marble-highlight" />
                                </g>
                            ))}

                            <rect x="0" y="0" width={BOARD_W} height={BOARD_H} className="glass-cover" />
                        </svg>

                        <button
                            onClick={handleLaunchClick}
                            disabled={!isLaunchReady}
                            title={isLaunchReady ? "點擊發射" : (isSpeechPractice ? "請先完成口說評測" : "請先答對題目")}
                            style={{ position: "absolute", left: "522px", top: "650px", width: "56px", height: "56px" }}
                            className={`rounded-full flex items-center justify-center font-black text-white shadow-xl transition-all duration-300 z-10 border-4 ${
                                isLaunchReady
                                    ? "bg-gradient-to-t from-red-500 to-yellow-400 border-white cursor-pointer hover:scale-110 active:scale-95 animate-bounce shadow-[0_0_15px_rgba(255,0,127,0.8)]"
                                    : "bg-gray-300 border-gray-400 cursor-not-allowed opacity-60 grayscale"
                            }`}
                        >
                            發射
                        </button>
                    </section>
                </div>
            );
        }

        function AnswerList({ items }) {
            if (!items || items.length === 0) return <p className="text-sm font-bold text-slate-500">尚無作答紀錄。</p>;
            return (
                <ol className="grid gap-2">
                    {items.map((item, index) => (
                        <li key={`${item.id}-${index}`} className="rounded-lg bg-white/80 border border-slate-200 px-3 py-2">
                            <div className="flex items-center justify-between gap-2">
                                <span className="font-black text-slate-900">{item.id}</span>
                                {Number.isFinite(item.bestScore) && <span className={`font-black ${item.status === "passed" ? "text-green-700" : "text-orange-700"}`}>{item.bestScore}分・{item.status === "passed" ? "達標" : "未達標"}</span>}
                            </div>
                            {item.stem && <p className="font-bold text-slate-600 mt-1">{item.stem}</p>}
                            {item.transcript && <p className="text-sm font-bold text-slate-500 mt-1">聽到：{item.transcript}</p>}
                            {!Number.isFinite(item.bestScore) && <p className="font-black text-green-700 mt-1">{item.correctAnswer}</p>}
                        </li>
                    ))}
                </ol>
            );
        }

        function SummaryPage({ result, onHome }) {
            useEffect(() => {
                playSummaryAudio();
            }, [result.id]);

            const winner =
                result.scores.pink === result.scores.blue
                    ? "雙方平手"
                    : result.scores.pink > result.scores.blue
                        ? "粉紅隊領先"
                        : "藍隊領先";

            return (
                <main className="summary-screen p-4 md:p-6 flex items-center justify-center">
                    <section className="summary-card w-full max-w-6xl backdrop-blur-md rounded-[28px] p-5 md:p-8">
                        <div className="text-center mb-6">
                            <p className="text-sm font-black text-purple-600">{result.modeLabel}</p>
                            <h1 className="text-4xl md:text-6xl font-black text-slate-900 mt-2">遊戲總結</h1>
                            <p className="text-xl font-black text-yellow-700 mt-2">{winner}</p>
                            {result.syncMessage && (
                                <p className={`inline-block mt-3 rounded-xl border-2 px-4 py-2 text-sm font-black ${
                                    result.syncStatus === "cloud"
                                        ? "bg-green-50 border-green-200 text-green-700"
                                        : result.syncStatus === "pending"
                                            ? "bg-cyan-50 border-cyan-200 text-cyan-700"
                                            : "bg-yellow-50 border-yellow-300 text-yellow-800"
                                }`}>
                                    {result.syncMessage}
                                </p>
                            )}
                        </div>

                        <div className="grid md:grid-cols-2 gap-5">
                            <div className="rounded-2xl border-4 border-pink-200 bg-pink-50 p-5">
                                <div className="flex items-center gap-4">
                                    <div className="team-icon pink result-badge shrink-0"></div>
                                    <div>
                                        <p className="text-lg font-black text-pink-600">粉紅隊</p>
                                        <h2 className="text-3xl font-black text-slate-900">{result.teams.pink}</h2>
                                        <p className="text-5xl font-black text-pink-600 mt-1">{result.scores.pink} 分</p>
                                    </div>
                                </div>
                                <div className="mt-5">
                                    <h3 className="text-lg font-black text-slate-900 mb-3">答對題目</h3>
                                    <AnswerList items={result.answers.pink} />
                                </div>
                            </div>

                            <div className="rounded-2xl border-4 border-cyan-200 bg-cyan-50 p-5">
                                <div className="flex items-center gap-4">
                                    <div className="team-icon blue result-badge shrink-0"></div>
                                    <div>
                                        <p className="text-lg font-black text-blue-600">藍隊</p>
                                        <h2 className="text-3xl font-black text-slate-900">{result.teams.blue}</h2>
                                        <p className="text-5xl font-black text-blue-600 mt-1">{result.scores.blue} 分</p>
                                    </div>
                                </div>
                                <div className="mt-5">
                                    <h3 className="text-lg font-black text-slate-900 mb-3">答對題目</h3>
                                    <AnswerList items={result.answers.blue} />
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 text-center">
                            <button
                                onClick={onHome}
                                className="rounded-xl bg-slate-900 text-white px-8 py-4 text-xl font-black shadow-lg hover:bg-slate-700"
                            >
                                <i className="fas fa-house mr-2"></i>
                                回到首頁
                            </button>
                        </div>
                    </section>
                </main>
            );
        }

        function TeacherDashboard({ onHome }) {
            const [date, setDate] = useState(todayString());
            const [records, setRecords] = useState([]);
            const [selectedId, setSelectedId] = useState("");
            const [loading, setLoading] = useState(false);
            const [recordSource, setRecordSource] = useState("cloud");
            const [statusMessage, setStatusMessage] = useState("");
            const [deleteTarget, setDeleteTarget] = useState(null);
            const [deleteBusy, setDeleteBusy] = useState(false);

            const refreshRecords = useCallback(async () => {
                setLoading(true);
                const result = await loadRecordsByDate(date);
                setRecords(result.records);
                setRecordSource(result.source);
                setStatusMessage(result.message);
                setLoading(false);
            }, [date]);

            useEffect(() => {
                refreshRecords();
            }, [refreshRecords]);

            const dayRecords = records.filter(record => record.date === date);
            const selected = dayRecords.find(record => record.id === selectedId) || null;

            useEffect(() => {
                if (dayRecords.length && !dayRecords.some(record => record.id === selectedId)) {
                    setSelectedId(dayRecords[0].id);
                }
                if (!dayRecords.length) setSelectedId("");
            }, [date, records.length, selectedId]);

            useEffect(() => {
                const handleFocus = () => refreshRecords();
                window.addEventListener("focus", handleFocus);
                return () => window.removeEventListener("focus", handleFocus);
            }, [refreshRecords]);

            const openDeleteConfirm = (event, record) => {
                event.preventDefault();
                setDeleteTarget(record);
            };

            const confirmDeleteRecord = async () => {
                if (!deleteTarget || deleteBusy) return;
                setDeleteBusy(true);
                const deletingId = deleteTarget.id;
                const result = await deleteRecord(deletingId);
                if (result.ok || recordSource === "local") {
                    setRecords(prev => prev.filter(record => record.id !== deletingId));
                    if (selectedId === deletingId) {
                        setSelectedId("");
                    }
                } else {
                    await refreshRecords();
                }
                setRecordSource(result.source);
                setStatusMessage(result.message);
                setDeleteBusy(false);
                setDeleteTarget(null);
            };

            return (
                <main className="teacher-screen p-4 md:p-6">
                    <section className="teacher-card max-w-7xl mx-auto backdrop-blur-md rounded-[28px] p-5 md:p-8">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
                            <div>
                                <p className="text-sm font-black text-purple-600">英聽與打彈珠小高手</p>
                                <h1 className="text-4xl font-black text-slate-900">教師後台</h1>
                            </div>
                            <button onClick={onHome} className="rounded-xl bg-slate-900 text-white px-5 py-3 font-black hover:bg-slate-700">
                                <i className="fas fa-house mr-2"></i>
                                回到首頁
                            </button>
                        </div>

                        <div className="grid lg:grid-cols-[360px_1fr] gap-5">
                            <aside className="rounded-2xl border-4 border-slate-200 bg-slate-50 p-4">
                                <label className="block">
                                    <span className="block font-black text-slate-700 mb-2">選擇日期</span>
                                    <input
                                        type="date"
                                        value={date}
                                        onChange={event => setDate(event.target.value)}
                                        className="w-full rounded-xl border-4 border-white bg-white px-4 py-3 text-lg font-black text-slate-900 outline-none focus:border-cyan-300"
                                    />
                                </label>

                                <div className={`mt-4 rounded-xl border-2 p-3 text-sm font-black ${
                                    recordSource === "cloud"
                                        ? "bg-green-50 border-green-200 text-green-700"
                                        : "bg-yellow-50 border-yellow-300 text-yellow-800"
                                }`}>
                                    {loading ? "正在讀取紀錄..." : statusMessage}
                                </div>

                                <button
                                    onClick={refreshRecords}
                                    disabled={loading}
                                    className="mt-3 w-full rounded-xl bg-cyan-500 text-white px-4 py-3 font-black shadow hover:bg-cyan-600 disabled:bg-slate-300"
                                >
                                    <i className="fas fa-rotate-right mr-2"></i>
                                    重新整理紀錄
                                </button>

                                <h2 className="text-xl font-black text-slate-900 mt-6 mb-3">學生名單</h2>
                                <div className="grid gap-3 max-h-[620px] overflow-y-auto pr-1">
                                    {loading ? (
                                        <p className="rounded-xl bg-white border border-slate-200 p-4 font-bold text-slate-500">正在讀取此日期的遊戲紀錄...</p>
                                    ) : dayRecords.length === 0 ? (
                                        <p className="rounded-xl bg-white border border-slate-200 p-4 font-bold text-slate-500">此日期還沒有遊戲紀錄。</p>
                                    ) : (
                                        dayRecords.map(record => (
                                            <button
                                                key={record.id}
                                                onClick={() => setSelectedId(record.id)}
                                                onContextMenu={event => openDeleteConfirm(event, record)}
                                                className={`rounded-xl border-4 p-4 text-left transition-all ${
                                                    selectedId === record.id
                                                        ? "bg-yellow-100 border-yellow-400 shadow-[4px_4px_0px_0px_rgba(236,72,153,0.24)]"
                                                        : "bg-white border-white hover:border-cyan-300"
                                                }`}
                                            >
                                                <p className="text-lg font-black text-slate-900">{record.students[0]}、{record.students[1]}</p>
                                                <p className="text-sm font-bold text-slate-500 mt-1">{localDateTimeLabel(record.playedAt)}・{record.modeLabel}</p>
                                            </button>
                                        ))
                                    )}
                                </div>
                            </aside>

                            <section className="rounded-2xl border-4 border-slate-200 bg-white p-4 md:p-6">
                                <h2 className="text-2xl font-black text-slate-900 mb-4">成績明細</h2>
                                {!selected ? (
                                    <div className="min-h-[320px] flex items-center justify-center text-center rounded-2xl bg-slate-50 border-4 border-dashed border-slate-200">
                                        <p className="text-xl font-black text-slate-500">請點選左側學生姓名查看報告。</p>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="grid md:grid-cols-2 gap-4 mb-5">
                                            <div className="rounded-2xl bg-pink-50 border-4 border-pink-200 p-4">
                                                <p className="text-lg font-black text-pink-600">粉紅隊</p>
                                                <h3 className="text-3xl font-black text-slate-900">{selected.teams.pink}</h3>
                                                <p className="text-5xl font-black text-pink-600 mt-2">{selected.scores.pink} 分</p>
                                            </div>
                                            <div className="rounded-2xl bg-cyan-50 border-4 border-cyan-200 p-4">
                                                <p className="text-lg font-black text-blue-600">藍隊</p>
                                                <h3 className="text-3xl font-black text-slate-900">{selected.teams.blue}</h3>
                                                <p className="text-5xl font-black text-blue-600 mt-2">{selected.scores.blue} 分</p>
                                            </div>
                                        </div>
                                        <p className="text-sm font-black text-purple-600 mb-4">{selected.modeLabel}・{localDateTimeLabel(selected.playedAt)}</p>
                                        <div className="grid md:grid-cols-2 gap-4">
                                            <div className="rounded-2xl bg-pink-50 border-4 border-pink-100 p-4">
                                                <h3 className="text-xl font-black text-slate-900 mb-3">粉紅隊答對題目</h3>
                                                <AnswerList items={selected.answers.pink} />
                                            </div>
                                            <div className="rounded-2xl bg-cyan-50 border-4 border-cyan-100 p-4">
                                                <h3 className="text-xl font-black text-slate-900 mb-3">藍隊答對題目</h3>
                                                <AnswerList items={selected.answers.blue} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </section>
                        </div>
                    </section>
                    {deleteTarget && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/45 px-4">
                            <div className="w-full max-w-md rounded-[24px] border-4 border-yellow-300 bg-white p-6 text-center shadow-[0_18px_48px_rgba(15,23,42,0.28)]">
                                <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-pink-100 text-3xl text-pink-600">
                                    <i className="fas fa-trash-can"></i>
                                </div>
                                <h2 className="text-3xl font-black text-slate-900">是否刪除此份資料？</h2>
                                <p className="mt-3 text-lg font-bold text-slate-600">
                                    {deleteTarget.students?.[0]}、{deleteTarget.students?.[1]}
                                </p>
                                <p className="mt-1 text-sm font-bold text-slate-500">
                                    {localDateTimeLabel(deleteTarget.playedAt)}・{deleteTarget.modeLabel}
                                </p>
                                <div className="mt-6 grid grid-cols-2 gap-3">
                                    <button
                                        onClick={confirmDeleteRecord}
                                        disabled={deleteBusy}
                                        className="rounded-xl bg-red-500 px-5 py-3 text-xl font-black text-white shadow hover:bg-red-600 disabled:bg-slate-300"
                                    >
                                        是
                                    </button>
                                    <button
                                        onClick={() => setDeleteTarget(null)}
                                        disabled={deleteBusy}
                                        className="rounded-xl bg-slate-100 px-5 py-3 text-xl font-black text-slate-700 shadow hover:bg-slate-200 disabled:bg-slate-200"
                                    >
                                        否
                                    </button>
                                </div>
                                {deleteBusy && <p className="mt-3 text-sm font-black text-slate-500">正在刪除資料...</p>}
                            </div>
                        </div>
                    )}
                </main>
            );
        }

        function App() {
            const [view, setView] = useState("home");
            const [showPassword, setShowPassword] = useState(false);
            const [config, setConfig] = useState(null);
            const [result, setResult] = useState(null);

            const startGame = (students, mode) => {
                const teams = Math.random() < 0.5
                    ? { pink: students[0], blue: students[1] }
                    : { pink: students[1], blue: students[0] };
                setConfig({
                    students,
                    mode,
                    teams,
                    totalTurns: getModeTotalTurns(mode),
                    roundsPerPlayer: getModeRoundsPerPlayer(mode),
                    questions: prepareQuestionSet(mode)
                });
                setResult(null);
                setView("game");
            };

            const finishGame = record => {
                const pendingRecord = {
                    ...record,
                    syncStatus: "pending",
                    syncMessage: "正在上傳紀錄到 Firebase..."
                };
                setResult(pendingRecord);
                setView("summary");
                saveRecord(record)
                    .then(syncResult => {
                        setResult(current => current?.id === record.id
                            ? {
                                ...current,
                                syncStatus: syncResult.status,
                                syncMessage: syncResult.message
                            }
                            : current
                        );
                    })
                    .catch(error => {
                        console.warn("紀錄處理失敗", error);
                        setResult(current => current?.id === record.id
                            ? {
                                ...current,
                                syncStatus: "local",
                                syncMessage: "紀錄上傳發生未預期錯誤，已先保存在這台平板。"
                            }
                            : current
                        );
                    });
            };

            const goHome = () => {
                setView("home");
                setConfig(null);
            };

            return (
                <>
                    {view === "home" && (
                        <HomePage
                            onStart={startGame}
                            onOpenTeacher={() => setShowPassword(true)}
                        />
                    )}
                    {view === "game" && config && (
                        <GamePage
                            key={`${config.mode}-${config.students.join("-")}-${config.questions[0]?.id}`}
                            config={config}
                            onFinish={finishGame}
                            onHome={goHome}
                        />
                    )}
                    {view === "summary" && result && (
                        <SummaryPage result={result} onHome={goHome} />
                    )}
                    {view === "teacher" && (
                        <TeacherDashboard onHome={goHome} />
                    )}
                    {showPassword && (
                        <PasswordModal
                            onClose={() => setShowPassword(false)}
                            onSuccess={() => {
                                setShowPassword(false);
                                setView("teacher");
                            }}
                        />
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
