<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HWG Story Reading Practice</title>
    
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
    <script type="module" src="./ai-scoring.js"></script>
    <!-- 載入 Google Fonts (Comic Neue 備援) -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --secondary: #3b82f6;
            --accent: #f59e0b;
            --accent2: #ec4899;
            --bg-color: #fefce8;
        }

        /* 全局強制套用 Comic Sans / Comic Relief 字型 */
        body, button, input, select, textarea, span, p, h1, h2, h3, h4, div {
            font-family: 'Comic Sans MS', 'Comic Relief', 'Comic Neue', cursive, sans-serif !important;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 2.5px, transparent 2.5px);
            background-size: 32px 32px;
            color: #333;
            -webkit-tap-highlight-color: transparent;
        }

        /* 隱藏捲動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 多巴胺立體按鈕特效 */
        .btn-dopamine {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 0 rgba(0,0,0,0.18);
        }
        .btn-dopamine:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0);
        }

        /* 錄音中特效 (紅色脈衝) */
        .recording-pulse {
            animation: pulse-red 1.5s infinite;
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #dc2626 !important;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* 彈跳視窗動畫 */
        .modal-overlay {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s ease-out;
        }
        .modal-content {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { 
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 可點擊單字樣式 */
        .clickable-word {
            display: inline-block;
            cursor: pointer;
            border-bottom: 3px dashed var(--secondary);
            margin: 0 4px;
            transition: all 0.2s;
            border-radius: 8px;
            padding: 0 4px;
        }
        .clickable-word:hover {
            background-color: #fef08a;
            transform: translateY(-2px) scale(1.05);
            color: #d97706;
        }

        .loading-spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid var(--secondary);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-3 sm:p-6">

    <!-- 全域 Loading 遮罩 -->
    <div id="global-loading" class="hidden fixed inset-0 z-[100] modal-overlay flex flex-col items-center justify-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl flex flex-col items-center text-center max-w-sm mx-4 border-4 border-amber-400">
            <div class="text-7xl mb-4 animate-bounce">🤖</div>
            <div class="loading-spinner mb-4"></div>
            <h3 class="text-3xl font-black text-indigo-600 mb-2" id="loading-title">AI 分析中...</h3>
            <p class="text-gray-600 font-black text-lg" id="loading-desc">正在仔細聽你的發音，請稍候 🚀</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 1. 首頁 (多巴胺鮮豔配色 + 文字放大 20% + iPad 橫向排版) -->

    <div id="view-home" class="flex-1 flex items-center justify-center p-4 w-full h-screen relative">
        
        <!-- 教師後臺入口按鈕 -->
        <button onclick="openTeacherLogin()" class="absolute top-6 right-6 z-50 bg-white hover:bg-pink-50 text-pink-600 border-4 border-pink-400 px-6 py-3 rounded-2xl font-black text-xl shadow-lg flex items-center gap-2 btn-dopamine transition-all">
            <span>👨‍🏫</span> 教師後臺
        </button>

        <div class="bg-white p-8 sm:p-10 rounded-[3.5rem] shadow-2xl border-8 border-indigo-400 w-full max-w-5xl flex flex-col md:flex-row gap-8 items-center relative overflow-hidden">
            
            <!-- 左側：多巴胺風格視覺大卡片 (佔 42%) -->
            <div class="w-full md:w-5/12 bg-gradient-to-br from-amber-100 via-rose-100 to-sky-100 p-8 rounded-[2.5rem] border-4 border-amber-300 flex flex-col items-center justify-center text-center shadow-inner">
                <div class="text-9xl mb-3 drop-shadow-md animate-bounce">🏆</div>
                <h1 class="text-6xl sm:text-7xl font-black text-blue-600 tracking-wide mb-2 drop-shadow-sm">HWG</h1>
                <h2 class="text-3xl sm:text-4xl font-black text-gray-700 leading-tight">Story Reading<br>Practice</h2>
                <div class="mt-6 inline-flex items-center gap-2 bg-white text-pink-600 px-6 py-2.5 rounded-full font-black text-lg shadow-md border-2 border-pink-200">
                    <span>✨</span> 英語口說發音特訓中心
                </div>
            </div>

            <!-- 右側：多色區塊選單與輸入 (佔 58%) -->
            <div class="w-full md:w-7/12 flex flex-col gap-5">
                
                <!-- 1. 選擇主題 (Theme) -->
                <div>
                    <p class="text-xl sm:text-2xl font-black text-blue-600 mb-2 flex items-center gap-2">
                        <span>📂</span> 1. 選擇主題 (Theme)：
                    </p>
                    <div class="grid grid-cols-4 gap-2.5">
                        <button onclick="selectTheme('HWG5')" id="btn-theme-HWG5" class="theme-btn py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">HWG5</button>
                        <button onclick="selectTheme('HWG6')" id="btn-theme-HWG6" class="theme-btn py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">HWG6</button>
                        <button onclick="selectTheme('HWG7')" id="btn-theme-HWG7" class="theme-btn py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">HWG7</button>
                        <button onclick="selectTheme('HWG8')" id="btn-theme-HWG8" class="theme-btn py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">HWG8</button>

                <!-- 2. 選擇單元 (Unit) -->

                        <button onclick="selectUnit('U02')" id="btn-unit-U02" class="unit-btn flex-1 py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">U02</button>
                        <button onclick="selectUnit('U03')" id="btn-unit-U03" class="unit-btn flex-1 py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">U03</button>
                        <button onclick="selectUnit('U04')" id="btn-unit-U04" class="unit-btn flex-1 py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine">U04</button>

                    <input type="number" id="student-id" placeholder="000" class="w-full px-6 py-4 rounded-2xl border-4 border-purple-200 text-center text-4xl sm:text-5xl font-black focus:border-purple-500 focus:outline-none transition-colors bg-purple-50/40 text-purple-900 placeholder-purple-300">
                </div>
                
                <!-- 開始練習按鈕 -->
                <button onclick="login()" class="btn-dopamine w-full bg-black text-white hover:bg-gray-900 text-3xl sm:text-4xl font-black py-4 sm:py-5 rounded-2xl flex items-center justify-center gap-3 mt-1 shadow-2xl border-4 border-gray-800">

    <!-- ========================================== -->
    <!-- 2. 練習畫面 (每頁 4 句) -->
    <!-- ========================================== -->
    <div id="view-practice" class="hidden flex-1 flex flex-col p-2 sm:p-6 relative max-w-5xl mx-auto w-full h-screen overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-4 bg-white p-4 rounded-3xl shadow-md border-4 border-indigo-300 sticky top-0 z-40">
            <div class="font-black text-xl sm:text-2xl text-gray-700">👤 學號: <span id="display-sid" class="text-blue-600"></span></div>
            <div class="font-black text-2xl sm:text-3xl text-pink-500" id="page-indicator">Page 1 / 10</div>
            <button onclick="showView('view-home')" class="text-gray-700 hover:text-pink-600 font-black text-xl bg-gray-100 border-3 border-gray-300 px-5 py-2.5 rounded-2xl flex items-center gap-1 btn-dopamine transition-colors">🏠 回到首頁</button>
        </div>

        <div id="sentences-container" class="flex-1 flex flex-col gap-6 pb-24"></div>

        <!-- 底部導覽列 -->
        <div class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md p-4 border-t-4 border-indigo-200 flex justify-between items-center z-40">
            <button id="btn-prev" onclick="changePage(-1)" class="btn-dopamine bg-gray-200 text-gray-700 border-2 border-gray-300 px-7 py-3.5 rounded-2xl font-black text-xl disabled:opacity-50">⬅️ 上一頁</button>
            <button onclick="showDashboard()" class="btn-dopamine bg-amber-500 text-white border-2 border-amber-600 px-7 py-3.5 rounded-2xl font-black text-xl flex items-center gap-2 shadow-lg">🌟 今日練習成果</button>
            <button id="btn-next" onclick="changePage(1)" class="btn-dopamine bg-emerald-500 text-white border-2 border-emerald-600 px-7 py-3.5 rounded-2xl font-black text-xl">下一頁 ➡️</button>
        </div>
    </div>

    <!-- 單字卡彈跳視窗 -->
    <div id="word-modal" class="hidden fixed inset-0 z-[60] modal-overlay flex items-center justify-center p-4" onclick="closeWordModal()">
        <div class="modal-content bg-white p-8 rounded-[2.5rem] shadow-2xl border-8 border-amber-400 w-full max-w-sm text-center relative" onclick="event.stopPropagation()">
            <button onclick="closeWordModal()" class="absolute top-4 right-4 bg-gray-100 text-gray-500 rounded-full w-10 h-10 font-black text-xl hover:bg-gray-200">✕</button>
            <h2 id="modal-word-en" class="text-5xl font-black text-pink-500 mb-4">Word</h2>
            <div class="bg-blue-50 p-5 rounded-3xl border-3 border-blue-200 mb-6">
                <p id="modal-word-tip" class="text-xl font-bold text-gray-700 leading-relaxed">提示訊息</p>
            </div>
            <button id="modal-btn-speak" class="btn-dopamine w-full bg-amber-500 hover:bg-amber-600 text-white text-2xl font-black py-4 rounded-2xl shadow-lg flex items-center justify-center gap-2 border-2 border-amber-600">
                🔊 聽發音
            </button>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- 3. 學生個人儀表板 -->
    <!-- ========================================== -->
    <div id="view-dashboard" class="hidden flex-1 flex flex-col p-4 sm:p-6 w-full max-w-4xl mx-auto h-screen overflow-y-auto no-scrollbar">
        <div class="flex justify-between items-center mb-6 bg-white p-6 rounded-[2.5rem] shadow-md border-6 border-amber-400">
            <h2 class="text-4xl font-black text-amber-500">🌟 今日挑戰成果</h2>
            <button onclick="showView('view-practice')" class="btn-dopamine bg-gray-100 text-gray-700 px-6 py-3.5 rounded-2xl font-black text-xl hover:bg-gray-200 border-2 border-gray-300">返回練習 ↩️</button>
        </div>
        <div id="dashboard-content" class="flex flex-col gap-4 pb-12"></div>
    </div>

    <!-- ========================================== -->
    <!-- 4. 教師後臺 -->
    <!-- ========================================== -->
    <div id="view-teacher" class="hidden flex-1 flex h-screen bg-gray-100 w-full overflow-hidden">
        <!-- 左側面板 -->
        <div class="w-80 bg-white border-r-4 border-gray-200 flex flex-col shadow-lg z-10">
            <div class="p-6 bg-indigo-500 text-white flex justify-between items-center">
                <h2 class="text-2xl font-black flex items-center gap-2">👨‍🏫 教師後臺</h2>
                <button onclick="closeTeacherDashboard()" class="text-white text-base font-black bg-white/20 px-4 py-1.5 rounded-xl hover:bg-white/30">登出</button>
            </div>
            <div class="p-4 border-b-2 border-gray-100 bg-gray-50">
                <input type="date" id="teacher-date-picker" class="w-full px-4 py-3 rounded-2xl border-3 border-gray-300 font-black text-gray-700 focus:border-indigo-500 outline-none text-lg" onchange="loadTeacherDateData()">
            </div>
            <div id="teacher-student-list" class="flex-1 overflow-y-auto p-2 no-scrollbar"></div>
        </div>

        <!-- 右側面板 -->
        <div class="flex-1 flex flex-col overflow-hidden bg-gray-50">
            <div class="p-6 bg-white border-b-4 border-gray-200 shadow-sm flex items-center justify-between flex-wrap gap-4" id="teacher-detail-header">
                <h3 class="text-3xl font-black text-gray-700">請選擇左側學生</h3>
                <div id="teacher-averages-container" class="flex gap-4 flex-wrap"></div>
            </div>
            <div id="teacher-detail-content" class="flex-1 overflow-y-auto p-6 flex flex-col gap-6 no-scrollbar"></div>
        </div>
    </div>

    <!-- Firebase 與核心邏輯腳本 -->
    <script>
        // 👉 1. Firebase AI Logic 與 App Check 公開設定（site key 不是秘密）
        const APP_CHECK_SITE_KEY = "6LeVaJktAAAAAAKgklO3h9PI3-l_15FMgIgZ4aOp";
        const AI_MODEL_NAME = "gemini-3.7-flash";
        window.HWG_AI_SCORING_READY = new Promise((resolve) => {
            window.__resolveHwgAiScoring = resolve;
        });
        // 👉 2. Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyA7GQLo5iiuS3cxlaHR3aNbFk7RW_lcQZU",
            authDomain: "hwg5-su-to-u04-story.firebaseapp.com",
            projectId: "hwg5-su-to-u04-story",
            storageBucket: "hwg5-su-to-u04-story.firebasestorage.app",
            messagingSenderId: "362090476515",
            appId: "1:362090476515:web:877a285182327a8277e6d6"
        };
        window.HWG_APP_CONFIG = Object.freeze({
            firebaseConfig,
            appCheckSiteKey: APP_CHECK_SITE_KEY,
            aiModelName: AI_MODEL_NAME
        });

        // 全域變數
        let currentStudentId = "";
        let currentTheme = "HWG5";
        let currentUnit = "SU";
        let practiceData = []; 
        let currentPage = 0;
        const ITEMS_PER_PAGE = 4;
        const MAX_SCORED_ATTEMPTS_PER_ITEM = 3;
        const RECORD_RETENTION_MONTHS = 7;
        const AUTHORIZED_TEACHER_EMAIL = "samchouou@gmail.com";

        let audioContext = null;
        let activeMediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordingSentenceId = null;
        let audioLevelReq = null;
        let lastSpeakTime = 0;

        let deleteTargetStudentId = "";
        let currentTeacherDate = "";
        let currentOwnerUid = "";

        // 初始化 Firebase
        try {
            if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
            if (["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname)) {
                self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
            }
            firebase.appCheck().activate(
                new firebase.appCheck.ReCaptchaEnterpriseProvider(APP_CHECK_SITE_KEY),
                true
            );
            window.auth = firebase.auth();
            window.auth.useDeviceLanguage();
            window.db = firebase.firestore();
            window.storage = firebase.storage();
            console.log("✅ Firebase 連線成功");
        } catch (e) {
            console.error("❌ Firebase 初始化錯誤:", e);
        }

        function todayRecordDate() {
            return new Date().toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');
        }

        function waitForAuthUser() {
            if (!window.auth) return Promise.reject(new Error("Firebase Authentication 尚未初始化。"));
            return new Promise((resolve, reject) => {
                let unsubscribe = () => {};
                unsubscribe = window.auth.onAuthStateChanged((user) => {
                    unsubscribe();
                    resolve(user);
                }, reject);
            });
        }

        function isAuthorizedTeacher(user) {
            return Boolean(
                user &&
                user.emailVerified === true &&
                String(user.email || "").toLowerCase() === AUTHORIZED_TEACHER_EMAIL &&
                Array.isArray(user.providerData) &&
                user.providerData.some((profile) => profile?.providerId === "google.com")
            );
        }

        async function ensureAnonymousStudentSession() {
            let user = await waitForAuthUser();
            if (user?.isAnonymous) return user;
            if (user) await window.auth.signOut();
            const credential = await window.auth.signInAnonymously();
            return credential.user;
        }

        async function requireTeacherUser() {
            const user = await waitForAuthUser();
            if (isAuthorizedTeacher(user)) return user;
            alert("教師登入已失效，請重新使用授權的 Google 帳戶登入。");
            showView('view-home');
            return null;
        }

        function attemptStorageKey(sentenceId) {
            return ["hwg-score-attempts", todayRecordDate(), currentStudentId, currentTheme, currentUnit, sentenceId].join(":");
        }

        function localAttemptCount(sentenceId) {
            try {
                return Number.parseInt(localStorage.getItem(attemptStorageKey(sentenceId)) || "0", 10) || 0;
            } catch {
                return 0;
            }
        }

        function markSuccessfulAttempt(sentenceId) {
            try {
                localStorage.setItem(attemptStorageKey(sentenceId), String(localAttemptCount(sentenceId) + 1));
            } catch (error) {
                console.warn("無法在此裝置保存練習次數：", error);
            }
        }

        async function cloudAttemptCount(sentenceId) {
            if (!window.db || !currentStudentId) return 0;
            try {
                const snapshot = await Promise.race([
                    window.db.collection("reading_records")
                        .where("ownerUid", "==", currentOwnerUid)
                        .where("studentId", "==", currentStudentId)
                        .where("date", "==", todayRecordDate())
                        .where("theme", "==", currentTheme)
                        .where("unit", "==", currentUnit)
                        .get(),
                    timeout(5000)
                ]);
                let count = 0;
                snapshot.forEach((doc) => {
                    if (doc.data().sentenceId === sentenceId) count += 1;
                });
                return count;
            } catch (error) {
                console.warn("無法讀取雲端練習次數，改用本機計數：", error);
                return 0;
            }
        }

        async function canStartScoring(sentenceId) {
            const attempts = Math.max(localAttemptCount(sentenceId), await cloudAttemptCount(sentenceId));
            if (attempts >= MAX_SCORED_ATTEMPTS_PER_ITEM) {
                alert(`今天這一題已完成 ${MAX_SCORED_ATTEMPTS_PER_ITEM} 次評分，明天再繼續挑戰喔！`);
                return false;
            }
            return true;
        }

        // ==========================================
        // 📚 題庫資料 (收錄 HWG5 SU ~ U04 與 HWG7 SU ~ U04 分析)
        // ==========================================
        const allPracticeData = {
            "HWG5-SU": [
                { id: "su_1", en: "Good afternoon!", zh: "午安！", focus: "Good 字尾 /d/ 要輕收。afternoon 重音在 noon。語氣要自然、明亮。", ssml: "<speak><prosody pitch='+5%'>Good</prosody> <break time='150ms'/> after<emphasis level='strong'>noon</emphasis>!</speak>" },

                { id: "hwg7_u01_5", en: "She's my friend. She's from the USA.", zh: "她是我的朋友。她來自美國。", focus: "難字：She's 字尾 /z/：She is 的縮寫，字尾 /z/ 要出來。；my 完整雙母音（來源未列完整 IPA）：雙母音要完整。；friend fr 開頭、字尾 /d/：fr 開頭要清楚，字尾 /d/ 要輕收。；from fr 開頭、字尾 /m/：fr 與字尾 /m/ 都要清楚。；the 有聲 th（來源未列完整 IPA）：不可唸成 de，也不可在連音時消失。；USA U-S-A 逐字母：逐字母唸 U-S-A，S 要清楚。 重音：重讀 She's、friend 與 USA。 連音：She's my 可連成 She's-my；my friend 可輕連但 friend 的 /d/ 要聽到；She's from the USA 可連讀，但 from 與 the 不可糊掉。 節奏：She's my friend. // She's from the USA. 語調：介紹朋友與國家；friend 與 USA 皆下降，語氣友善、自然。 評分：檢查 She's /z/、my 雙母音、friend 的 fr/d、from /m/、the 有聲 th、USA 逐字母，以及兩句下降語調。", ssml: "<speak>She&apos;s my friend. She&apos;s from the USA.</speak>" },

                { id: "hwg7_u01_7", en: "Yes, it is.", zh: "是的，它是。", focus: "難字：Yes 字尾 /s/：字尾 /s/ 要清楚。；it 字尾 /t/：字尾 /t/ 可輕收。；is 字尾 /z/：字尾 /z/ 要清楚，不可在連音時消失。 重音：重讀 Yes 與 is。 連音：it is 可自然連成 it-is，但 is 不可消失。 節奏：Yes, / it is. 語調：肯定回答；Yes 與 it is 都下降，語氣自然、肯定。 評分：檢查 Yes /s/、it /t/、is /z/ 與 it-is 連音，並以兩段下降語調作答。", ssml: "<speak>Yes, it is.</speak>" },
                { id: "hwg7_u01_8", en: "Where are you from?", zh: "你們來自哪裡？", focus: "難字：Where /wer/：w 音與 r 音都要聽得出來；r 音不可消失。；are 句中輕讀（來源未列完整 IPA）：可以輕讀，但不可省略。；from fr 開頭、字尾 /m/：fr 與字尾 /m/ 要清楚。 重音：重讀 Where 與 from。 連音：Where are 可連成 Where-are；are you 可連成 are-you；you from 可自然連音，但 from 的 /m/ 要收。 節奏：Where are you / from? 語調：店家詢問多位客人來自哪裡；語氣友善、好奇，句尾下降。 評分：檢查 Where 的 w/r、are 不可省略、from 的 fr 與 /m/，以及友善的 wh-question 下降語調。", ssml: "<speak>Where are you from?</speak>" },
                { id: "hwg7_u01_9", en: "We're from Taiwan.", zh: "我們來自臺灣。", focus: "難字：We're r 音（來源未列完整 IPA）：We are 的縮寫，r 音要有。；from fr 開頭、字尾 /m/：fr 與字尾 /m/ 要清楚。；Taiwan Tai-WAN（來源未列完整 IPA）：Tai 的雙母音要清楚，重音在後半段 WAN。 重音：重讀 We're 與 Taiwan；Taiwan 重音在 WAN。 連音：We're from 可連成 We're-from；from Taiwan 可輕連，但 Taiwan 要清楚。 節奏：We're / from Taiwan. 語調：團體回答，語氣自然、有自信；Taiwan 是核心資訊，句尾下降。 評分：檢查 We're 的 r、from 的 fr 與 /m/、Taiwan 後半段重音，以及有自信的下降語調。", ssml: "<speak>We&apos;re from Taiwan.</speak>" }
            ],
            "HWG7-U02": [
                { id: "hwg7_u02_1", en: "Where are we?", zh: "我們在哪裡？", focus: "難字：Where r 音（來源未列完整 IPA）：r 音要清楚。；are 句中輕讀（來源未列完整 IPA）：可以輕讀，但不可完全消失。；we 不可過短（來源未列完整 IPA）：要清楚，不要唸太短。 重音：重讀 Where 與 we。 連音：Where are 可連成 Where-are，但不可糊成 Where we；are we 可輕連，但仍要聽得出 are。 節奏：Where are / we? 語調：wh-question；角色在陌生地方帶疑惑感，句尾 we 下降，不作 yes/no 問句上揚。 評分：檢查 Where 的 r、are 不省略、we 不過短，以及 wh-question 句尾下降。", ssml: "<speak>Where are we?</speak>" },

                { id: "hwg7_u02_6", en: "Yes. How do you go to school?", zh: "是的。你們如何上學？", focus: "難字：Yes 字尾 /s/：字尾 /s/ 要清楚。；How h、/aʊ/：h 與雙母音 /aʊ/ 要出來。；do 連音中不省略（來源未列完整 IPA）：do you 可輕連，但 do 不可完全消失。；school /sk/、字尾 /l/：/sk/ 與字尾 /l/ 要清楚。 重音：重讀 Yes、How、go 與 school。 連音：How do you 可連成 How-do-you，但不可變成 How you；go to school 可連成 go-to-school。 節奏：Yes. // How do you / go to school? 語調：Yes 簡短下降；後半為 wh-question，句尾 school 下降，語氣自然詢問上學方式。 評分：檢查 Yes /s/、How 的 h/aʊ、do 不省略、school 的 /sk/ /l/，以及兩段下降語調。", ssml: "<speak>Yes. How do you go to school?</speak>" },

                { id: "hwg7_u02_8", en: "He goes to school by car.", zh: "他搭車上學。", focus: "難字：He /iː/：長音 /iː/ 要清楚。；goes 字尾 /z/：第三人稱字尾 /z/ 要出來。；school /sk/、字尾 /l/：/sk/ 與字尾 /l/ 要清楚。；by /aɪ/：雙母音 /aɪ/ 要完整。；car r 音（來源未列完整 IPA）：r 音要自然收尾。 重音：重讀 He、goes、school 與 car。 連音：goes to school 可連成 goes-to-school，但 goes 的 /z/ 不可吞掉；by car 可輕連，但 car 的 r 要有。 節奏：He goes / to school / by car. 語調：說明第三人稱上學方式，goes 是語法重點、car 是交通方式重點；句尾下降。 評分：檢查 He /iː/、goes /z/、school /sk/ /l/、by /aɪ/、car 的 r，以及下降語調。", ssml: "<speak>He goes to school by car.</speak>" }

                { id: "hwg7_u03_8", en: "Look! I play baseball on weekends.", zh: "看！我週末打棒球。", focus: "難字：Look /ʊ/、字尾 /k/：短音 /ʊ/ 與字尾 /k/ 要收。；I /aɪ/：雙母音 /aɪ/ 要完整。；play /pl/、/eɪ/：/pl/ 與長音 /eɪ/ 要清楚。；baseball 第一音節重、base /eɪ/：第一音節重，base 的長音 /eɪ/ 要清楚。；weekends 字尾 /z/：字尾 /z/ 要出來。 重音：重讀 Look、I、play、baseball 與 weekends；baseball 第一音節重。 連音：Look 後小停頓；I play baseball 可連成 I-play-baseball；on weekends 可輕連，但 weekends 的 /z/ 不可漏。 節奏：Look! // I play baseball / on weekends. 語調：Look 短、亮並下降；後半有興奮感，baseball 與 weekends 是重點，句尾下降。 評分：檢查 Look /ʊ/ /k/ 與停頓、I /aɪ/、play /pl/ /eɪ/、baseball 重音、weekends /z/，以及興奮但清楚的下降語調。", ssml: "<speak>Look! I play baseball on weekends.</speak>" }

                { id: "hwg5_u04_4", en: "Bye, zebras.", zh: "再見，斑馬們。", focus: "難字：Bye /aɪ/：雙母音 /aɪ/ 要完整。；zebras z、字尾 /z/：開頭 z 與字尾 /z/ 要清楚。 重音：重讀 Bye 與 zebras。 連音：Bye 後可小停頓；zebras 要清楚，不可糊成 zebra。 節奏：Bye, / zebras. 語調：友善告別；Bye 稍明亮，zebras 下降收句。 評分：檢查 Bye /aɪ/、停頓、zebras 開頭與複數 /z/，以及友善下降語調。", ssml: "<speak>Bye, zebras.</speak>" },

        function selectTheme(theme) {
            currentTheme = theme;
            Object.keys(themeConfig).forEach(t => {
                const btn = document.getElementById(`btn-theme-${t}`);
                if (btn) {
                    btn.className = `theme-btn py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine ${t === theme ? themeConfig[t].active : themeConfig[t].inactive}`;
                }
            });
        }

        function selectUnit(unit) {
            currentUnit = unit;
            Object.keys(unitConfig).forEach(u => {
                const btn = document.getElementById(`btn-unit-${u}`);
                if (btn) {
                    btn.className = `unit-btn flex-1 py-3.5 rounded-2xl font-black text-xl sm:text-2xl border-4 transition-all btn-dopamine ${u === unit ? unitConfig[u].active : unitConfig[u].inactive}`;
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            selectTheme('HWG5');
            selectUnit('SU');
        });

        // 登入流程
        async function login() {
            const sid = document.getElementById('student-id').value.trim();
            if (!sid) { alert("🚨 請輸入學號喔！"); return; }
            if (!/^[0-9]{1,12}$/.test(sid)) { alert("🚨 學號請輸入 1 到 12 位數字。"); return; }
            if (window.isSecureContext === false) { alert("⚠️ 網址不安全！請使用 https 開頭的正式網址。"); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
            } catch (err) {
                alert("⚠️ 必須允許麥克風權限才能進行錄音練習喔！請檢查瀏覽器設定。");
                return;
            }

            try {
                const studentUser = await ensureAnonymousStudentSession();
                currentOwnerUid = studentUser.uid;
            } catch (error) {
                console.error("匿名學生驗證失敗：", error);
                alert("⚠️ 學生安全驗證失敗，請檢查網路後再試一次。");
                return;
            }

            currentStudentId = sid;
            currentPage = 0;
            
            const dataKey = `${currentTheme}-${currentUnit}`;
            practiceData = allPracticeData[dataKey];
            if (!practiceData || practiceData.length === 0) {
                practiceData = [
                    { id: "demo_1", en: `This is ${currentTheme} ${currentUnit}.`, zh: "教材準備中。", focus: "請唸清楚。", ssml: `<speak>This is <emphasis level='strong'>${currentTheme}</emphasis> <emphasis level='strong'>${currentUnit}</emphasis>.</speak>` }
                ];
            }

            document.getElementById('display-sid').innerText = `${sid} (${currentTheme}-${currentUnit})`;
            renderPage();
            showView('view-practice');
        }

        function showView(viewId) {
            ['view-home', 'view-practice', 'view-dashboard', 'view-teacher'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        function renderPage() {
            const container = document.getElementById('sentences-container');
            container.innerHTML = '';
            
            const totalPages = Math.ceil(practiceData.length / ITEMS_PER_PAGE);
            document.getElementById('page-indicator').innerText = `Page ${currentPage + 1} / ${totalPages}`;
            
            document.getElementById('btn-prev').disabled = currentPage === 0;
            document.getElementById('btn-next').disabled = currentPage === totalPages - 1;

            const startIdx = currentPage * ITEMS_PER_PAGE;
            const pageItems = practiceData.slice(startIdx, startIdx + ITEMS_PER_PAGE);

            pageItems.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl p-6 sm:p-8 shadow-md border-4 border-indigo-200 flex flex-col gap-4";
                card.id = `card-${item.id}`;

                let clickableEnHtml = item.en.split(/([\s,.!?]+)/).map(part => {
                    if (/^[a-zA-Z']+$/.test(part)) {
                        const cleanWord = part.replace(/[']/g, "\\'");
                        return `<span class="clickable-word text-3xl sm:text-4xl font-black text-gray-800" onclick="handleWordClick('${cleanWord}')">${part}</span>`;
                    }
                    return `<span class="text-3xl sm:text-4xl font-black text-gray-800">${part}</span>`;
                }).join('');

                card.innerHTML = `
                    <div class="flex flex-col gap-3">
                        <div class="flex items-center gap-4">
                            <span class="bg-blue-600 text-white font-black text-2xl w-12 h-12 flex items-center justify-center rounded-2xl shrink-0 shadow-md">${startIdx + index + 1}</span>
                            <div class="leading-relaxed">
                                ${clickableEnHtml}
                            </div>
                        </div>
                        <div id="zh-${item.id}" class="text-gray-500 text-xl font-bold ml-16 hidden">${item.zh}</div>
                    </div>
                    
                    <div class="flex flex-wrap gap-3 mt-2 ml-16">
                        <button onclick="playSentenceTTS('${item.id}')" class="btn-dopamine bg-blue-100 text-blue-700 border-2 border-blue-200 px-5 py-2.5 rounded-2xl font-black text-lg flex items-center gap-1 hover:bg-blue-200">🔊 聽示範</button>
                        <button onclick="toggleZh('${item.id}')" class="btn-dopamine bg-purple-100 text-purple-700 border-2 border-purple-200 px-5 py-2.5 rounded-2xl font-black text-lg flex items-center gap-1 hover:bg-purple-200">🇹🇼 翻譯</button>
                        <button id="btn-record-${item.id}" onclick="toggleRecord('${item.id}')" class="btn-dopamine bg-rose-100 text-rose-600 border-2 border-rose-300 px-6 py-2.5 rounded-2xl font-black text-lg flex items-center gap-2 hover:bg-rose-200 ml-auto transition-all duration-300">
                            🎤 開始錄音
                        </button>
                    </div>

                    <div id="status-${item.id}" class="text-base font-black text-center mt-2 hidden"></div>
                    <div id="result-${item.id}" class="hidden mt-4 pt-4 border-t-2 border-gray-100"></div>
                `;
                container.appendChild(card);
            });
        }

        function changePage(delta) {
            const totalPages = Math.ceil(practiceData.length / ITEMS_PER_PAGE);
            if (currentPage + delta >= 0 && currentPage + delta < totalPages) {
                currentPage += delta;
                renderPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function toggleZh(id) {
            const zhEl = document.getElementById(`zh-${id}`);
            zhEl.classList.toggle('hidden');

        async function speakWithGoogleTTS(ssml) {
            const xml = new DOMParser().parseFromString(String(ssml || ""), "application/xml");
            if (xml.querySelector("parsererror")) throw new Error("TTS 文字格式不正確。");
            const text = (xml.documentElement?.textContent || "").replace(/\s+/g, " ").trim();
            const services = await Promise.race([window.HWG_AI_SCORING_READY, timeout(15000)]);
            if (!services?.speakText) throw new Error("安全語音服務尚未就緒。");
            const audioContent = await services.speakText(text);
            const audio = new Audio("data:audio/mp3;base64," + audioContent);
            await audio.play();
        }

        // ==========================================
        // VAD 與錄音系統
        // ==========================================
        async function toggleRecord(id) {
            if (isRecording) { stopRecording(); return; }
            if (!(await canStartScoring(id))) return;
            recordingSentenceId = id;
            try {
                activeMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(activeMediaStream);
                const analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                let hasSpoken = false;
                lastSpeakTime = Date.now();

                const checkAudioLevel = () => {
                    if (!isRecording) return;
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    let average = sum / dataArray.length;

                    const statusEl = document.getElementById(`status-${recordingSentenceId}`);
                    if (average > 15) {
                        hasSpoken = true;
                        lastSpeakTime = Date.now();
                        statusEl.innerText = "🗣️ 收到聲音，請繼續唸...";
                        statusEl.className = "text-base font-black text-center mt-2 text-green-500 animate-pulse";
                    } else if (hasSpoken && Date.now() - lastSpeakTime > 4000) {
                        console.log("偵測到靜音，自動停止錄音");
                        stopRecording();
                        return;
                    } else if (!hasSpoken) {
                        statusEl.innerText = "🎧 正在聆聽，請開始唸...";
                        statusEl.className = "text-base font-black text-center mt-2 text-gray-500";
                    }
                    audioLevelReq = requestAnimationFrame(checkAudioLevel);
                };

                let options = {};
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    options = { mimeType: 'audio/webm;codecs=opus' };
                } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    options = { mimeType: 'audio/webm' };
                } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    options = { mimeType: 'audio/mp4' };
                }

                mediaRecorder = new MediaRecorder(activeMediaStream, options);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = processAudioRecording;
                
                mediaRecorder.start(100);
                isRecording = true;
                
                const btn = document.getElementById(`btn-record-${id}`);
                btn.innerHTML = "⏹️ 停止錄音";
                btn.classList.add('recording-pulse');
                
                const statusEl = document.getElementById(`status-${id}`);
                statusEl.innerText = "🎧 準備就緒，請說話...";
                statusEl.className = "text-base font-black text-center mt-2 text-gray-500 block";

                checkAudioLevel();

            } catch (err) {
                alert("無法存取麥克風，請檢查權限設定！");
                console.error(err);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                if (audioLevelReq) cancelAnimationFrame(audioLevelReq);
                if (audioContext) audioContext.close();
                activeMediaStream.getTracks().forEach(track => track.stop());
                
                const btn = document.getElementById(`btn-record-${recordingSentenceId}`);
                if(btn){
                    btn.innerHTML = "🎤 開始錄音";
                    btn.classList.remove('recording-pulse');
                }
                const statusEl = document.getElementById(`status-${recordingSentenceId}`);
                if(statusEl) statusEl.classList.add('hidden');
            }
        }

        const timeout = (ms) => new Promise((resolve, reject) => setTimeout(() => reject(new Error("Timeout")), ms));

        // ==========================================
        // 🚀 AI 評分核心（Firebase AI Logic + App Check）
        // ==========================================
        async function processAudioRecording() {
            if (audioChunks.length === 0) return;
            const recordMime = mediaRecorder.mimeType || 'audio/webm';
            const audioBlob = new Blob(audioChunks, { type: recordMime });
            showLoading("AI 教練批改中...");
            
            const sid = recordingSentenceId;
            const targetSentenceObj = practiceData.find(x => x.id === sid);
            const targetText = targetSentenceObj.en;
            const focusRule = targetSentenceObj.focus;

            try {
                const base64Audio = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(audioBlob);
                });

                const aiScoring = await Promise.race([window.HWG_AI_SCORING_READY, timeout(15000)]);
                if (!aiScoring) {
                    const initMessage = window.HWG_AI_INIT_ERROR?.message || "Firebase AI Logic 尚未完成初始化。";
                    throw new Error(initMessage);
                }

                const cleanMime = recordMime.split(';')[0] || "audio/webm";
                const aiResult = await Promise.race([
                    aiScoring.scoreAudio({
                        base64Audio,
                        mimeType: cleanMime,
                        targetText,
                        focusRule
                    }),
                    timeout(60000)
                ]);
                markSuccessfulAttempt(sid);

                // 備份音檔至 Storage 與 Firestore (15 秒寬限)
                let audioUrl = "";
                const todayDateStr = todayRecordDate();
                const expiresAt = new Date();
                expiresAt.setMonth(expiresAt.getMonth() + RECORD_RETENTION_MONTHS);
                try {
                    if (window.storage && window.db) {
                        if (!currentOwnerUid) throw new Error("學生驗證狀態已失效。請回首頁重新進入。");
                        const audioPath = `audio_records/${currentOwnerUid}/${currentStudentId}/${Date.now()}.webm`;
                        const fileRef = window.storage.ref(audioPath);
                        await Promise.race([
                            fileRef.put(audioBlob, { customMetadata: { expiresAt: expiresAt.toISOString() } }),
                            timeout(15000)
                        ]);
                        audioUrl = await fileRef.getDownloadURL();
                        
                        await Promise.race([
                            window.db.collection("reading_records").add({
                                ownerUid: currentOwnerUid,
                                studentId: currentStudentId, 
                                theme: currentTheme, 
                                unit: currentUnit, 
                                date: todayDateStr, 
                                sentenceId: sid,
                                targetText: targetText, 
                                transcript: aiResult.transcript, 
                                score: aiResult.total_score,
                                feedback: aiResult.feedback, 
                                audioUrl: audioUrl,
                                audioPath: audioPath,
                                expiresAt: expiresAt,
                                timestamp: firebase.firestore.FieldValue.serverTimestamp()
                            }), timeout(5000)
                        ]);
                    }
                } catch (dbErr) {
                    console.warn("備份失敗，但仍正常顯示成績:", dbErr);
                }

                displayResult(sid, aiResult, targetText);

            } catch (err) {
                console.error("AI 分析失敗:", err);
                alert("🚨 AI 評分失敗原因：\n" + (err.message || err));
            }
            hideLoading();
        }

        }

        async function deleteStudentRecords() {
            if(!window.db || !deleteTargetStudentId || !currentTeacherDate) return;
            if (!await requireTeacherUser()) return;
            try {
                const snapshot = await window.db.collection("reading_records")
                    .where("studentId", "==", deleteTargetStudentId)
                    .where("date", "==", currentTeacherDate)
                    .get();
                
                const batch = window.db.batch();
                snapshot.forEach(doc => batch.delete(doc.ref));
                await batch.commit();
                alert(`已刪除 ${deleteTargetStudentId} 的資料`);
                document.getElementById('teacher-detail-content').innerHTML = '';
                document.getElementById('teacher-detail-header').innerHTML = '<h3 class="text-3xl font-black text-gray-700">請選擇左側學生</h3><div id="teacher-averages-container" class="flex gap-4"></div>';
                loadTeacherDateData();
            } catch(e) {
                console.error(e);
                alert("刪除失敗");
            }
        }

        // ==========================================
        // UI 輔助功能
        // ==========================================
        function showLoading(title) {
            document.getElementById('loading-title').innerText = title;
            document.getElementById('global-loading').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('global-loading').classList.add('hidden');
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (character) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            })[character]);
        }
    </script>
</body>
</html>
