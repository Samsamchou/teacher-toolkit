<!doctype html><meta charset="utf-8"><title>二水三景點 2D player</title>
<style>
@font-face{font-family:"Comic Relief";src:url("fonts/ComicRelief-Bold.ttf");font-weight:700 900}
html,body{margin:0;background:#000}canvas{display:block;width:1920px;height:1080px}
</style>
<canvas id="cv" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script src="a3d.js"></script>
<script src="b3d.js" onerror="void 0"></script>
<script src="ershui.js"></script>
<script src="shots.js"></script>
<script>
window.NOSUB = new URLSearchParams(location.search).get('nosub') === '1';
loadImages().then(() => document.fonts.load('700 50px "Comic Relief"')).then(() => document.fonts.ready).then(() => {
  buildShots(); SHOTS.sort((a, b) => a.t0 - b.t0);
  const c = document.getElementById('cv').getContext('2d');
  window.renderFrame = T => { c.setTransform(1,0,0,1,0,0); c.globalAlpha = 1; c.filter = 'none'; c.clearRect(0,0,W,H); draw(c, T); };
  window.DUR = TL.dur; window.READY = true;
});
</script>
