        --accent: #e8433a;
        --sub: #c9b8ff;

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      .scene { position: absolute; inset: 0; }
      .scene svg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      svg text { font-family: var(--font-display); font-weight: 900; }
      .lab-main { font-size: 44px; fill: var(--ink); }
      .lab-sub { font-size: 28px; fill: var(--sub); font-weight: 800; }
      .label { opacity: 0; }
      #sentence { position: absolute; left: 0; right: 0; top: 120px; text-align: center;
        font-size: 112px; font-weight: 900; color: var(--ink); letter-spacing: -0.01em; }
      #sentence .w { display: inline-block; margin: 0 14px; opacity: 0; }
      #sentence .red { color: var(--accent); }
    </style>
  </head>

        <div id="sentence"><span class="w" id="w1">I</span><span class="w" id="w2">go</span><span class="w" id="w3">to</span><span class="w" id="w4">school</span><span class="w red" id="w5">by</span><span class="w red" id="w6">bus.</span></div>
      </div>

      <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="10" data-track-index="5"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 相機慢推 / slow camera push
      tl.fromTo("#cam", { scale: 1, svgOrigin: "1300 760" }, { scale: 1.07, svgOrigin: "1300 760", duration: 6.4, ease: "sine.inOut" }, 0);
      tl.fromTo(["#sun", "#sunGlow"], { y: 30 }, { y: -10, duration: 6.2, ease: "sine.out" }, 0);
      tl.fromTo("#cloud", { x: 0 }, { x: -40, duration: 6.2, ease: "none" }, 0);
      tl.fromTo("#twinkle", { opacity: 0.25 }, { opacity: 0.9, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      // 馬尾擺動、呼吸 / ponytail sway, breathing
      tl.fromTo("#pony", { rotation: -4, svgOrigin: "0 -552" }, { rotation: 5, svgOrigin: "0 -552", duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 6 }, 0);
      tl.fromTo("#kidBody", { scaleY: 1, svgOrigin: "0 0" }, { scaleY: 1.012, svgOrigin: "0 0", duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

      // 標籤一 / label 1
      tl.fromTo("#lab1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 1.2);
      tl.to("#lab1", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.4);

      // 公車開入並停下 / bus drives in and stops
      tl.fromTo("#busMove", { x: -900 }, { x: 654, duration: 1.7, ease: "power3.out" }, 3.5);
      tl.fromTo("#wheelL", { rotation: 0, svgOrigin: "150 245" }, { rotation: 720, svgOrigin: "150 245", duration: 1.7, ease: "power3.out" }, 3.5);
      tl.fromTo("#wheelR", { rotation: 0, svgOrigin: "600 245" }, { rotation: 720, svgOrigin: "600 245", duration: 1.7, ease: "power3.out" }, 3.5);
      tl.fromTo("#beamG", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 4.2);
      tl.fromTo("#busBody", { y: 0 }, { y: 8, duration: 0.14, ease: "power2.out" }, 5.2);
      tl.to("#busBody", { y: -4, duration: 0.18, ease: "sine.inOut" }, 5.34);
      tl.to("#busBody", { y: 0, duration: 0.2, ease: "sine.out" }, 5.52);
      // 學生往公車踏一步 / student steps toward the bus
      tl.fromTo("#kidMove", { x: 1560 }, { x: 1520, duration: 0.5, ease: "power2.inOut" }, 5.7);

      // 標籤二 / label 2
      tl.fromTo("#lab2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 5.4);

      // 轉場：拉遠到地圖 / zoom out to the map
      // 鏡頭往上搖進天空，再從天空俯視到地圖 / tilt up into the sky, then down onto the map
      tl.fromTo("#cam", { y: 0 }, { y: 760, duration: 0.55, ease: "power2.in" }, 6.25);
      tl.to(["#lab2"], { opacity: 0, duration: 0.2 }, 6.25);
      tl.fromTo("#mapInner", { scale: 1.35, opacity: 0, svgOrigin: "960 640" }, { scale: 1, opacity: 1, svgOrigin: "960 640", duration: 0.7, ease: "power2.out" }, 6.75);

      // 地圖上的公車沿路線 / the bus along the route
      const route = document.querySelector("#route");
      const mbus = document.querySelector("#mbus");
      const trail = document.querySelector("#trail");
      const len = route.getTotalLength();
      const prog = { p: 0 };
      const placeBus = () => {
        const L = len * prog.p;
        const a = route.getPointAtLength(L);
        const b = route.getPointAtLength(Math.min(len, L + 2));
        const c = route.getPointAtLength(Math.max(0, L - 2));
        const ang = Math.atan2(b.y - c.y, b.x - c.x) * 180 / Math.PI;
        mbus.setAttribute("transform", `translate(${a.x} ${a.y}) rotate(${ang})`);
        trail.setAttribute("stroke-dashoffset", String(1400 - L * 1400 / len));
      };
      placeBus();
      tl.fromTo(prog, { p: 0 }, { p: 1, duration: 2.4, ease: "power1.inOut", onUpdate: placeBus }, 7.0);

      tl.fromTo("#lab3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 7.6);

      // 大句逐字 / sentence, word by word
      ["#w1", "#w2", "#w3", "#w4", "#w5", "#w6"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, y: 40, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "back.out(1.8)" }, 7.4 + i * 0.18);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
