<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>座標獵人 Coordinate Hunter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hero">
        <p class="eyebrow">ELEMENTARY MATH × ENGLISH TOOL</p>
        <h1>座標獵人 <span>Coordinate Hunter</span></h1>
        <p class="intro">找出藏在黑板上的 10 個座標！ Find the hidden coordinates!</p>
      </header>

      <section class="status-panel" aria-label="遊戲狀態">
        <div class="status-card">
          <span>分數 Score</span>
          <strong id="score">0 / 10</strong>
        </div>
        <div class="status-card timer-card">
          <span>剩餘時間 Time</span>
          <strong id="timer">60</strong>
          <small>seconds</small>
        </div>
        <div class="status-card">
          <span>目標 Targets</span>
          <strong>10</strong>
          <small>hidden points</small>
        </div>
      </section>

      <section class="board-card">
        <div class="board-heading">
          <div>
            <h2>座標棋盤 Coordinate Grid</h2>
            <p>輸入格式 Input format：<code>x,y</code>，例如 <code>2,-3</code></p>
          </div>
          <span class="axis-note">y ↑ &nbsp; x →</span>
        </div>
        <div id="board" class="board" role="grid" aria-label="從負五到五的座標棋盤"></div>
      </section>

      <section class="control-card" aria-label="輸入座標">
        <form id="guess-form" autocomplete="off">
          <label for="guess">你的猜測 Your guess</label>
          <div class="input-row">
            <input id="guess" name="guess" inputmode="numeric" placeholder="例如 2,-3" aria-describedby="message" />
            <button type="submit">發射！ Hunt</button>
          </div>
        </form>
        <p id="message" class="message" role="status" aria-live="polite">準備好了嗎？ Ready?</p>
        <button id="restart" class="restart-button" type="button">重新開始 Restart</button>
      </section>

      <footer>黑底白字，像粉筆寫黑板。 Chalkboard mode.</footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
