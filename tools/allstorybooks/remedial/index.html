<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123d43" />
    <meta
      name="description"
      content="學扶電子語音繪本收藏頁：Friends meet 與 School day。"
    />
    <title>學扶電子繪本｜電子語音繪本館</title>
    <link rel="stylesheet" href="../site.css" />
  </head>
  <body class="library-body" data-page="remedial">
    <header class="site-header">
      <a class="site-brand" href="../index.html" aria-label="電子語音繪本館首頁">
        <span class="site-brand__mark" aria-hidden="true">✦</span>
        <span>
          <strong>電子語音繪本館</strong>
          <small>Read · Listen · Grow</small>
        </span>
      </a>
      <div class="header-actions">
        <span class="student-chip" id="studentChip">讀取學號中</span>
        <a class="home-link" href="../index.html">回分類首頁</a>
      </div>
    </header>

    <main class="library-main">
      <section class="shelf-hero">
        <div>
          <p class="section-kicker">REMEDIAL STORY SHELF</p>
          <h1>學扶電子繪本</h1>
          <p class="shelf-hero__copy">
            選一本故事開始閱讀。每一頁都要按喇叭並完整聽完兩次，
            右側箭頭才會出現。
          </p>
        </div>
        <div class="shelf-hero__rule">
          每頁閱讀規則
          <strong>🎧 × 2 次</strong>
        </div>
      </section>

      <section class="book-shelf" aria-labelledby="bookShelfTitle">
        <div class="book-shelf__heading">
          <h2 id="bookShelfTitle">四年級常用語</h2>
          <span>目前共 2 本</span>
        </div>

        <div class="book-grid">
          <article class="book-card">
            <div class="book-card__visual">
              <img
                src="G4/public/assets/generated/friends-meet-cover.png"
                alt="Friends meet 封面"
              />
              <span class="book-card__number">01</span>
            </div>
            <div class="book-card__body">
              <div>
                <h3>Friends meet</h3>
                <p>7 頁 · 朋友相遇常用語 · 每頁聽 2 次</p>
              </div>
              <a class="book-launch" href="G4/public/index.html">
                開始閱讀 <span aria-hidden="true">→</span>
              </a>
            </div>
          </article>

          <article class="book-card">
            <div class="book-card__visual">
              <img
                src="G4/school-day/public/assets/generated/school-day-cover.png"
                alt="School day 封面"
              />
              <span class="book-card__number">02</span>
            </div>
            <div class="book-card__body">
              <div>
                <h3>School day</h3>
                <p>12 頁 · 校園生活常用語 · 每頁聽 2 次</p>
              </div>
              <a class="book-launch" href="G4/school-day/public/index.html">
                開始閱讀 <span aria-hidden="true">→</span>
              </a>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>聽兩次 · 讀一頁 · 每天進步一點點</span>
    </footer>

    <script src="../site.js"></script>
  </body>
</html>
