<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Plink-oh! 音效 A/B 試聽</title><style>body{font:18px system-ui;background:#241344;color:#fff;max-width:1100px;margin:auto;padding:30px}h1{color:#ffe62e}.card{padding:22px;margin:18px 0;background:#392160;border:1px solid #8061ae;border-radius:16px}.pair{display:flex;gap:24px;flex-wrap:wrap}small{display:block;color:#d5c5ed}audio{max-width:100%}button,select{font:inherit;padding:10px;border-radius:8px}a{color:#b8eaff}.status{color:#ffe680}label{display:block}</style><h1>Plink-oh! 音效 A/B 試聽</h1><p>左側為原影片裁切，右側為降噪／整理後的候選音。尚未通過教師聽感驗收；混音可能仍有殘留。這不是「已完全復刻」的宣告。</p><p>先比較音色與音尾，再到遊戲核對碰撞同步。整段落球混音僅供參考，不用於互動播放。此頁只在本機預覽提供，評語保存在目前瀏覽器。</p><button id="export">Export review／匯出試聽紀錄</button><div id="list">Loading…</div><h2>四次完整落球參考</h2><div id="mixed"></div><script type="module">
const manifest=await fetch('/plinkoh/audio/manifest.json').then(r=>r.json());const root=document.querySelector('#list');root.textContent='';let reviews={};try{reviews=JSON.parse(localStorage.getItem('plinkoh-ab-review')||'{}')}catch{}
for(const cue of manifest.cues){const article=document.createElement('section');article.className='card';const h=document.createElement('h2');h.textContent=cue.label;article.append(h);const text=document.createElement('p');text.textContent=`來源 ${cue.sourceTime.join('–')} 秒 · ${cue.sourceStatus}`;article.append(text);const pair=document.createElement('div');pair.className='pair';for(const [name,url]of [['A — 原片參考',cue.reference],['B — 實作候選',cue.url]]){const d=document.createElement('div');const l=document.createElement('label');l.textContent=name;const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=url;audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()}));d.append(l,audio);pair.append(d)}article.append(pair);const small=document.createElement('small');small.textContent=cue.processing;article.append(small);const select=document.createElement('select');select.setAttribute('aria-label',cue.eventId+' review');for(const [value,text]of [['pending','尚未驗收'],['pass','教師確認可接受'],['revise','需要修正']]){const o=new Option(text,value);select.add(o)}select.value=reviews[cue.eventId]||'pending';select.onchange=()=>{reviews[cue.eventId]=select.value;localStorage.setItem('plinkoh-ab-review',JSON.stringify(reviews))};article.append(select);root.append(article)}
for(let i=1;i<=4;i++){const a=document.createElement('audio');a.controls=true;a.preload='none';a.src=`/qa/plinkoh-20260919/audio/mixed-drop-${i}.wav`;document.querySelector('#mixed').append(a)}
document.querySelector('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({sourceSha256:manifest.sourceSha256,reviewedAt:new Date().toISOString(),reviews},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='plinkoh-listening-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
