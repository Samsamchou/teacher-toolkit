<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Thanksgiving Card</title>
<style>
@font-face{font-family:Comic;src:url(ComicRelief-Regular.ttf)}
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:297mm;height:210mm;background:#fff}
.card{position:relative;width:297mm;height:210mm;background:#fffaf0;overflow:hidden;font-family:Comic,"Comic Sans MS",sans-serif;color:#4a2a12}
/* 雙線邊框：外粗內細 */
.frame{position:absolute;inset:7mm;border:2.2mm solid #c8743a;border-radius:9mm}
.frame2{position:absolute;inset:11mm;border:0.6mm dashed #d9a066;border-radius:6mm}
.deco{position:absolute;inset:0;pointer-events:none}
h1{position:absolute;top:15mm;left:0;right:0;text-align:center;font-size:15mm;color:#b5532a;letter-spacing:.5mm;font-weight:normal}
.left{position:absolute;left:22mm;top:38mm;width:150mm}
.row{display:flex;align-items:flex-end;height:15.6mm;font-size:6.4mm;white-space:nowrap}
.row b{font-weight:normal}
.blank{flex:1;border-bottom:0.5mm solid #8a5a30;margin:0 1.5mm 1.6mm;min-width:12mm}
.short{flex:0 0 38mm}
.blank{position:relative}.blank i{position:absolute;left:1mm;bottom:-4.4mm;font-style:normal;font-size:2.9mm;color:#c0a080}
.hint{position:absolute;left:22mm;bottom:15mm;font-size:3.4mm;color:#a07850}
.right{position:absolute;right:20mm;top:38mm;width:100mm;height:142mm;border:0.7mm dashed #c8743a;border-radius:6mm;background:#fff}
.right span{position:absolute;bottom:3mm;left:0;right:0;text-align:center;font-size:3.6mm;color:#c8a080}
</style></head><body>
<div class="card">
  <svg class="deco" viewBox="0 0 297 210" width="297mm" height="210mm">
    <defs>
      <path id="leaf" d="M0,-6 L1.4,-2.4 L4.6,-3.6 L3.4,-0.6 L6,0.6 L2.6,1.6 L3,4.4 L0.4,2.8 L0,6.5 L-0.4,2.8 L-3,4.4 L-2.6,1.6 L-6,0.6 L-3.4,-0.6 L-4.6,-3.6 L-1.4,-2.4 Z" stroke-linejoin="round"/>
      <g id="pumpkin"><ellipse cx="-3" cy="0" rx="3.6" ry="4.2"/><ellipse cx="3" cy="0" rx="3.6" ry="4.2"/><ellipse cx="0" cy="0" rx="3.6" ry="4.4"/><path d="M0,-4.2 q0.6,-2.4 2,-3" fill="none" stroke="#6b8e3a" stroke-width="1"/></g>
    </defs>
    <!-- 四個角：楓葉＋南瓜 -->
    <g stroke="#a0522d" stroke-width="0.5">
      <use href="#leaf" transform="translate(14,15) rotate(-20) scale(1.3)" fill="#f2a65a"/>
      <use href="#leaf" transform="translate(25,10) rotate(25)" fill="#e8c35a"/>
      <use href="#leaf" transform="translate(283,15) rotate(20) scale(1.3)" fill="#e07b4f"/>
      <use href="#leaf" transform="translate(272,10) rotate(-30)" fill="#f2a65a"/>
      <use href="#leaf" transform="translate(14,195) rotate(200) scale(1.2)" fill="#e8c35a"/>
      <use href="#pumpkin" transform="translate(27,199) scale(0.9)" fill="#f0a050"/>
      <use href="#leaf" transform="translate(283,195) rotate(160) scale(1.2)" fill="#e07b4f"/>
      <use href="#pumpkin" transform="translate(270,199) scale(0.9)" fill="#f0a050"/>
      <!-- 標題兩旁 -->
      <use href="#leaf" transform="translate(52,22) rotate(-15) scale(0.9)" fill="#f2a65a"/>
      <use href="#leaf" transform="translate(245,22) rotate(15) scale(0.9)" fill="#e07b4f"/>
    </g>
  </svg>
  <div class="frame"></div><div class="frame2"></div>
  <h1>Happy Thanksgiving!</h1>
  <div class="left">
    <div class="row"><b>To:</b><span class="blank short"></span></div>
    <div class="row"><b>I'm</b><span class="blank"><i>你的名字</i></span><b>.</b></div>
    <div class="row"><span class="blank"><i>感恩節小知識（文化句）</i></span><b>.</b></div>
    <div class="row"><b>I'm thankful for</b><span class="blank"></span></div>
    <div class="row"><b>because</b><span class="blank"></span><b>.</b></div>
    <div class="row"><b>I'm thankful for</b><span class="blank"></span></div>
    <div class="row"><b>because</b><span class="blank"></span><b>.</b></div>
    <div class="row"><span class="blank"><i>結尾句</i></span><b>!</b></div>
    <div class="row" style="justify-content:flex-end"><b>From:</b><span class="blank short"></span></div>
  </div>
  <div class="right"><span>Draw a picture 畫一張圖</span></div>
</div>
</body></html>
